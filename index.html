<script>
// ═══════════════════════════════════════════════════════
//  KONFIGURASI — EDIT DI SINI
// ═══════════════════════════════════════════════════════
const AD_CONFIG = {
  allAds: false,
  gridPageAds:  { nativeBanner: true },
  videoPageAds: { nativeBanner: true },
  useDirect:    false,
  usePopunder:  false,
  gridBannerAfterRow:  1,
  gridColumnsOnMobile: 2,
  links: {
    direct:   "https://mediaindonesia.com",
    popunder: "https://google.com",
  },
  nativeBannerHTML: `
    <div style="display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#c00 0%,#e00 60%,#f52 100%);padding:14px 40px 14px 14px;border-radius:10px;min-height:90px;font-family:'Segoe UI',sans-serif;cursor:pointer;text-decoration:none;box-sizing:border-box;width:100%;" onclick="window.open('https://google.com','_blank')">
      <div style="flex-shrink:0;text-align:center;color:#ffdd00;font-size:11px;font-weight:800;line-height:1.2;">CONTOH<br>IKLAN</div>
      <div style="flex-grow:1;">
        <div style="color:#fff;font-size:18px;font-weight:900;letter-spacing:0.5px;text-transform:uppercase;line-height:1.2;">IKLAN NATIVE BANNER</div>
        <div style="color:rgba(255,255,255,0.85);font-size:12px;margin-top:4px;">Pasang kode iklan native Anda di sini</div>
      </div>
      <div style="flex-shrink:0;background:#ffdd00;color:#c00;font-size:11px;font-weight:900;padding:6px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap;">PELAJARI</div>
    </div>
  `
};

const PLAY_AD_CONFIG = {
  enablePlayButtonDirectAds: true,
  adUrl:            "https://mediaindonesia.com",
  adStartFromVideo: 2,
};

// ── SOURCE-BASED SYSTEM ──────────────────────────────
// source:'seo'      → index,follow  + canonical
// source:'nofollow' → noindex,nofollow + no canonical
// ────────────────────────────────────────────────────
let videoWatchCount  = 0;
let playCounter      = 0;
let videoDatabaseEN  = [];
let videoDatabaseID  = [];
let videoDatabaseALL = [];

// ═══════════════════════════════════════════════════════
//  BLOKIR GOOGLE TRANSLATE POPUP
// ═══════════════════════════════════════════════════════
(function blockGoogleTranslate() {
  document.documentElement.setAttribute('translate', 'no');
  document.documentElement.classList.add('notranslate');
})();

// ═══════════════════════════════════════════════════════
//  HTML LANG — selalu EN
// ═══════════════════════════════════════════════════════
function updateHtmlLang() {
  document.getElementById('html-root').setAttribute('lang', 'en');
  const metaLang = document.getElementById('meta-content-language');
  if (metaLang) metaLang.setAttribute('content', 'en');
  const ogLocale = document.querySelector('meta[property="og:locale"]');
  if (ogLocale) ogLocale.setAttribute('content', 'en_US');
}

// ═══════════════════════════════════════════════════════
//  CANONICAL
// ═══════════════════════════════════════════════════════
function updateCanonical(slug, source) {
  let c = document.getElementById('dynamic-canonical');
  if (source === 'nofollow') {
    if (c) c.remove();
    return;
  }
  if (!c) {
    c = document.createElement('link');
    c.id  = 'dynamic-canonical';
    c.rel = 'canonical';
    document.head.appendChild(c);
  }
  c.href = (!slug || slug === 'home')
    ? 'https://www.trend4genz.fun/'
    : window.location.origin + window.location.pathname + '?v=' + slug;
}

// ═══════════════════════════════════════════════════════
//  ROBOTS
// ═══════════════════════════════════════════════════════
function updateRobotsBySource(source) {
  let tag = document.querySelector('meta[name="robots"]');
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute('name', 'robots');
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', source === 'nofollow' ? 'noindex, nofollow' : 'index, follow');
}

// ═══════════════════════════════════════════════════════
//  LOAD DATABASE
// ═══════════════════════════════════════════════════════
async function loadDatabases() {
  try {
    const [resEN, resID] = await Promise.all([
      fetch('./db-en.json'),
      fetch('./db-id.json')
    ]);
    videoDatabaseEN  = (await resEN.json()).map(v => ({ ...v, source: v.source || 'seo' }));
    videoDatabaseID  = (await resID.json()).map(v => ({ ...v, source: v.source || 'nofollow' }));
    videoDatabaseALL = [...videoDatabaseEN, ...videoDatabaseID].sort(() => 0.5 - Math.random());
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><p style="color:#ff032d;">❌ Gagal memuat database.</p></div>';
    throw e;
  }
}

function getUrlParams()   { return new URLSearchParams(window.location.search); }
function getCurrentSlug() { return getUrlParams().get('v'); }

function seoUrl(text) {
  if (!text) return '';
  if (text.includes('-')) return text;
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}

function navigateTo(slug) {
  const video = videoDatabaseALL.find(v => v.slug === slug || seoUrl(v.title) === slug);
  if (!video) return;
  history.pushState({}, '', window.location.pathname + '?v=' + video.slug);
  router();
}

function buildNativeBanner(extraClass) {
  if (!AD_CONFIG.allAds) return '';
  return `
    <div class="native-banner-wrap ${extraClass||''}" id="native-banner-${Date.now()}">
      <div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'" title="Tutup">✕</div>
      <div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div>
    </div>`;
}

function runAd(type) {
  if (!AD_CONFIG.allAds) return;
  if (type === 'pop'    && AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder, '_blank');
  if (type === 'direct' && AD_CONFIG.useDirect)   window.open(AD_CONFIG.links.direct,   '_blank');
}

function handleBrandClick() {
  runAd('pop');
  history.pushState({}, '', window.location.pathname);
  router();
}

function handleSpecialOffer() {
  if (AD_CONFIG.allAds && AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct, '_blank');
}

// ═══════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════
function initSearch() {
  const input       = document.getElementById('searchInput');
  const searchBtn   = document.getElementById('searchBtn');
  const suggestions = document.getElementById('searchSuggestions');
  if (!input || !searchBtn || !suggestions) return;

  let activeIndex = -1;

  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    activeIndex = -1;
    if (val.length < 1) { hideSuggestions(); return; }

    const matches = videoDatabaseALL
      .filter(v => v.title.toLowerCase().includes(val))
      .slice(0, 7);

    if (matches.length === 0) {
      suggestions.innerHTML = `<div class="suggestion-empty">Tidak ada hasil untuk "<b>${val}</b>"</div>`;
      suggestions.classList.add('show');
      return;
    }

    function highlight(text, query) {
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<em>$1</em>');
    }

    suggestions.innerHTML = matches.map((v, i) => `
      <div class="suggestion-item" data-slug="${v.slug}" data-index="${i}">
        <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" loading="lazy" alt="${v.title}"/>
        <span>${highlight(v.title, val)}</span>
      </div>
    `).join('');
    suggestions.classList.add('show');

    suggestions.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        const slug = item.getAttribute('data-slug');
        input.value = '';
        hideSuggestions();
        navigateTo(slug);
      });
    });
  });

  input.addEventListener('keydown', e => {
    const items = suggestions.querySelectorAll('.suggestion-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      updateActive(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, -1);
      updateActive(items);
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0 && items[activeIndex]) {
        const slug = items[activeIndex].getAttribute('data-slug');
        input.value = '';
        hideSuggestions();
        navigateTo(slug);
      } else { doSearch(); }
    } else if (e.key === 'Escape') {
      hideSuggestions();
      input.blur();
    }
  });

  function updateActive(items) {
    items.forEach((item, i) => item.classList.toggle('active', i === activeIndex));
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrapper')) hideSuggestions();
  });

  searchBtn.addEventListener('click', doSearch);

  function hideSuggestions() {
    suggestions.classList.remove('show');
    suggestions.innerHTML = '';
    activeIndex = -1;
  }
}

function doSearch() {
  const input       = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');
  if (!input) return;
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (suggestions) { suggestions.classList.remove('show'); suggestions.innerHTML = ''; }
  const results = videoDatabaseALL.filter(v => v.title.toLowerCase().includes(val));
  renderGrid(document.getElementById('app'), results);
  document.getElementById('main-navbar').classList.remove('video-mode');
}

// ═══════════════════════════════════════════════════════
//  HANDLE PLAY
// ═══════════════════════════════════════════════════════
function handlePlay(youtubeId) {
  playCounter++;
  const adAktif = PLAY_AD_CONFIG.enablePlayButtonDirectAds
    && videoWatchCount >= PLAY_AD_CONFIG.adStartFromVideo
    && playCounter === 1;
  if (adAktif) window.open(PLAY_AD_CONFIG.adUrl, '_blank');

  document.getElementById('player-box').innerHTML =
    '<iframe src="https://www.youtube.com/embed/' + youtubeId +
    '?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1"' +
    ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>' +
    '<div class="video-mask mask-top"></div>' +
    '<div class="video-mask mask-bottom"></div>' +
    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
}

function toggleFullScreen() {
  const elem = document.getElementById('player-box');
  const icon = document.querySelector('#fs-btn i');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    icon.className = 'fas fa-compress';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    icon.className = 'fas fa-expand';
  }
}

function renderGrid(container, data) {
  const cols             = window.innerWidth >= 992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow + 1) * cols - 1;
  const showGridBanner   = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  const gridItems = data.map((v, i) => {
    const nofollowAttr = v.source === 'nofollow' ? ' rel="nofollow"' : '';
    let html = `
      <a href="?v=${v.slug}"${nofollowAttr} class="video-card-link" style="text-decoration:none;color:inherit;"
         onclick="handleNavigation(event,'${v.slug}')">
        <div class="video-card">
          <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title}" loading="lazy"/>
          <div class="video-card-title">${v.title}</div>
        </div>
      </a>`;
    if (showGridBanner && i === insertAfterIndex)
      html += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    return html;
  }).join('');

  container.className = 'main-content';
  container.innerHTML =
    '<h5 class="mb-3" style="color:#98FB98">🔥 TRENDING VIDEO</h5>' +
    '<div class="video-grid">' + gridItems + '</div>';
}

function handleNavigation(event, slug) {
  event.preventDefault();
  navigateTo(slug);
}

// ═══════════════════════════════════════════════════════
//  UPDATE META TAGS — OG via id, Schema VideoObject utuh
//  Pinterest Rich Pin membaca og: tags ini
//  Google rich result membaca Schema VideoObject
// ═══════════════════════════════════════════════════════
function updateMetaTags(video) {
  const title       = video.title + " | Trend4GenZ";
  const description = video.summary
    ? video.summary.replace(/<[^>]*>/g,'').substring(0,160)
    : video.title;
  // Gambar langsung dari YouTube — tidak perlu server eksternal
  const image = 'https://img.youtube.com/vi/' + video.youtubeId + '/maxresdefault.jpg';
  const url   = window.location.href;

  document.title = title;

  // Update meta description
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', description);

  // Update OG via id — Pinterest membaca ini
  const ogMap = {
    'og-type'        : 'video.other',
    'og-title'       : title,
    'og-description' : description,
    'og-url'         : url,
    'og-image'       : image,
    'og-image-width' : '1280',
    'og-image-height': '720',
    'og-image-alt'   : video.title,
  };
  Object.entries(ogMap).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.setAttribute('content', val);
  });

  // Schema VideoObject — Google rich result (tidak diubah)
  const existingSchema = document.getElementById('schema-video');
  if (existingSchema) existingSchema.remove();
  const schema = document.createElement('script');
  schema.id   = 'schema-video';
  schema.type = 'application/ld+json';
  schema.textContent = JSON.stringify({
    "@context"    : "https://schema.org",
    "@type"       : "VideoObject",
    "name"        : video.title,
    "description" : description,
    "uploadDate"  : video.uploadDate || new Date().toISOString().substring(0,19) + '+00:00',
    "thumbnailUrl": [
      "https://img.youtube.com/vi/" + video.youtubeId + "/maxresdefault.jpg",
      "https://img.youtube.com/vi/" + video.youtubeId + "/hqdefault.jpg",
      "https://img.youtube.com/vi/" + video.youtubeId + "/mqdefault.jpg"
    ],
    "embedUrl"    : "https://www.youtube.com/embed/" + video.youtubeId,
    "url"         : url,
    "inLanguage"  : video.source === 'nofollow' ? "id" : "en",
    "publisher"   : {
      "@type": "Organization",
      "name" : "Trend4GenZ",
      "url"  : "https://www.trend4genz.fun",
      "logo" : {
        "@type": "ImageObject",
        "url"  : "https://www.trend4genz.fun/logo.png"
      }
    }
  });
  document.head.appendChild(schema);
}

function renderVideo(container, v) {
  updateMetaTags(v);
  updateRobotsBySource(v.source);
  updateCanonical(v.slug, v.source);
  document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el => el.remove());

  videoWatchCount++;
  playCounter = 0;

  container.className = 'main-content video-page-container';
  const related = videoDatabaseALL
    .filter(item => item.slug !== v.slug)
    .sort(() => 0.5 - Math.random())
    .slice(0, 8);
  const showVideoBanner = AD_CONFIG.allAds && AD_CONFIG.videoPageAds.nativeBanner;

  container.innerHTML =
    '<div class="player-container" id="player-box">' +
    '<div class="play-overlay" onclick="handlePlay(\'' + v.youtubeId + '\')">' +
    '<i class="fas fa-play-circle"></i>' +
    '<div id="play-msg" style="margin-top:10px;font-weight:bold;">TAP TO WATCH</div>' +
    '</div>' +
    '<img src="https://img.youtube.com/vi/' + v.youtubeId + '/maxresdefault.jpg" style="width:100%;height:100%;object-fit:cover;"/>' +
    '</div>' +
    '<div class="mobile-only-notice">📱 Full Screen Wide? Click [:] at the top ↗️ then select Open in Browser</div>' +
    '<div class="info-section" style="padding:15px;">' +
    '<h1 style="font-size:1.2rem;font-weight:800;margin:15px 0;">' + v.title + '</h1>' +
    '<div class="dual-action-wrap">' +
    '<button class="home-split-btn" onclick="handleBrandClick()"><i class="fas fa-home"></i> HOME</button>' +
    '<button class="offer-split-btn" onclick="handleSpecialOffer()"><i class="fas fa-bolt"></i> SPECIAL OFFER 🔥</button>' +
    '</div>' +
    (showVideoBanner ? buildNativeBanner() : '') +
    '<div class="summary-box"><div class="summary-text">' + v.summary + '</div></div>' +
    '<div style="display:none;">' + (v.tags ? v.tags.join(', ') : '') + '</div>' +
    '<h6 class="mt-4 mb-3" style="color:#98FB98">MORE VIDEOS</h6>' +
    '<div class="recommendation-slider">' +
    related.map(r =>
      '<div class="slider-item" onclick="navigateTo(\'' + r.slug + '\')">' +
      '<img src="https://img.youtube.com/vi/' + r.youtubeId + '/mqdefault.jpg" loading="lazy"/>' +
      '<p>' + r.title + '</p>' +
      '</div>'
    ).join('') +
    '</div></div>';
}

// ═══════════════════════════════════════════════════════
//  ROUTER UTAMA
// ═══════════════════════════════════════════════════════
async function router() {
  const app    = document.getElementById('app');
  const navbar = document.getElementById('main-navbar');
  const slug   = getCurrentSlug();

  updateHtmlLang();
  updateRobotsBySource('seo');

  if (!slug || slug === 'home') {
    navbar.classList.remove('video-mode');
    renderGrid(app, videoDatabaseALL);
    updateCanonical('home', 'seo');
  } else {
    const video = videoDatabaseALL.find(v => v.slug === slug || seoUrl(v.title) === slug);
    if (video) {
      navbar.classList.add('video-mode');
      renderVideo(app, video);
      updateMetaTags(video);
    } else {
      navbar.classList.remove('video-mode');
      document.title = "Trend4GenZ - Streaming";
      renderGrid(app, videoDatabaseALL);
      updateCanonical('home', 'seo');
    }
  }
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', router);
window.addEventListener('load', async () => {
  await loadDatabases();
  initSearch();
  router();
});
</script>
