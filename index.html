  <!-- ════════════════════════════════════════════════════════
       CRITICAL CSS — INLINE (no render blocking)

  <style>
    /* ── Reset & Base ── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:#212122;color:#f1f1f1;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

    /* ── CSS Variables ── */
    :root{
      --green:#98FB98;--red:#ff032d;--dark:#1a1a1a;--bg:#212122;
      --nav-h:52px;
    }

    /* ── Navbar ── */
    #main-navbar{
      background:#000;padding:10px 15px;position:sticky;top:0;z-index:1000;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1.5px solid var(--green);
      transition:border 0.3s,padding 0.3s;
    }
    #main-navbar.video-mode{border-bottom:0;padding:6px 15px}
    #main-navbar.video-mode .brand-logo{display:none}
    #main-navbar.video-mode .search-container input{width:45px}
    #main-navbar.video-mode .search-container input:focus{width:85px}

    .brand-logo{color:var(--green);font-weight:900;font-size:1.5rem;cursor:pointer;text-decoration:none;text-transform:uppercase;letter-spacing:-0.5px}
    .navbar-right{display:flex;align-items:center;margin-left:auto}

    /* ── Search ── */
    .search-wrapper{position:relative;display:flex;align-items:center;z-index:9999}
    .search-container{display:flex;align-items:center;background:#1a1a1a;border-radius:20px;padding:5px 12px;border:1px solid var(--green)}
    .search-container input{background:transparent;border:none;color:#fff;outline:none;font-size:0.85rem;width:100px;transition:width 0.3s}
    .search-container input:focus{width:150px}
    .search-icon{color:var(--green);font-size:0.8rem;cursor:pointer;width:14px;height:14px;flex-shrink:0}

    /* ── Main layout ── */
    #app{padding:15px;max-width:1150px;margin:auto}

    /* ── Loading ── */
    .loading-screen{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:15px}
    .loading-screen p{color:var(--green);font-size:0.9rem}
    .spinner{width:32px;height:32px;border:3px solid rgba(152,251,152,0.2);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Video Grid ── */
    .section-title{color:var(--green);font-size:1rem;font-weight:700;margin-bottom:12px}
    .video-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
    @media(min-width:992px){.video-grid{grid-template-columns:repeat(4,1fr);gap:20px}}

    .video-card{background:var(--dark);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s;border:1px solid transparent;text-decoration:none;color:inherit;display:block}
    .video-card:hover{border-color:var(--green);transform:translateY(-3px)}

    /* ── Thumbnail lazy wrapper ── */
    .thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden}
    .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:1}
    /* Shimmer hanya muncul saat data-src masih ada (belum diload) */
    .thumb-wrap.loading::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#111 25%,#1e1e1e 50%,#111 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;z-index:2;pointer-events:none}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    .video-card-title{padding:7px 8px 8px;font-size:0.78rem;font-weight:600;line-height:1.35;height:44px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    /* ── Grid full span (banner) ── */
    .grid-full-span{grid-column:1/-1}

    /* ── Video page ── */
    .player-container{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
    @media(max-width:600px){.player-container{border-radius:0}}
    .player-container iframe{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:1}
    .video-mask{position:absolute;z-index:99999;background:transparent;pointer-events:all;touch-action:none}
    .mask-top{top:0;left:0;width:65%;height:55px}
    .mask-bottom{bottom:0;left:40%;width:100%;height:43px}
    #player-box:fullscreen .video-mask,#player-box:-webkit-full-screen .video-mask{display:block!important}

    .btn-fs-custom{position:absolute;bottom:18px;right:18px;z-index:2147483647;cursor:pointer;background:transparent;color:#fff;width:23px;height:23px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;box-shadow:0 0 20px var(--green);border:2px solid var(--green)}

    /* ── Summary ── */
    .summary-box{background:rgba(255,255,255,0.05);padding:18px;border-radius:12px;border-left:4px solid var(--green)}

    /* ── Recommendation slider ── */
    .rec-title{color:var(--green);font-weight:700;margin:18px 0 10px;font-size:0.9rem}

    .recommendation-slider::-webkit-scrollbar{display:none}
    .slider-item{min-width:158px;background:var(--dark);border-radius:8px;overflow:hidden;cursor:pointer;flex-shrink:0}
    .slider-item .thumb-wrap{aspect-ratio:16/9}
    .slider-item p{font-size:0.72rem;padding:7px 8px;margin:0;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    /* ── Search suggestions ── */
    .search-suggestions{position:absolute;top:calc(100% + 6px);right:0;width:280px;background:#1a1a1a;border:1px solid var(--green);border-radius:10px;overflow:hidden;z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,0.6);display:none}
    .search-suggestions.show{display:block}
    .suggestion-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.05)}
    .suggestion-item:last-child{border-bottom:none}
    .suggestion-item:hover,.suggestion-item.active{background:rgba(152,251,152,0.12)}
    .suggestion-item img{width:52px;height:30px;object-fit:cover;border-radius:4px;flex-shrink:0}
    .suggestion-item span{font-size:0.75rem;color:#f1f1f1;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .suggestion-item span em{color:var(--green);font-style:normal;font-weight:bold}
    .suggestion-empty{padding:12px;text-align:center;font-size:0.75rem;color:#888}
    @media(max-width:768px){.search-suggestions{width:240px}}

    /* ── Native banner ── */
    .native-banner-wrap{position:relative;width:100%;margin:14px 0;border-radius:10px;overflow:hidden;min-height:90px}
    .native-banner-wrap .close-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;background:rgba(0,0,0,0.65);color:#fff;border:2px solid #fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;cursor:pointer;z-index:10}

    /* ── Mobile notice ── */
    .mobile-only-notice{display:none}
    @media(max-width:768px){
      .mobile-only-notice{display:block;background:#5c0303;color:#fff;text-align:center;padding:5px 8px;font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
      .search-container input{width:60px!important}
      .search-container input:focus{width:80px!important}
    }
    @media(max-width:600px){
      #app{padding:0}
      .info-section{padding:12px}
    }

  </style>
</head>

  <!-- ════════════════════════════════════════════════════════
       DEFERRED non-critical CSS — load after page paint
       preload trick: rel=preload as=style → onload swap to stylesheet
  ═════════════════════════════════════════════════════════ -->
  <!-- Font Awesome hanya dibutuhkan di video page (fa-expand, fa-home, fa-bolt) -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/></noscript>

  <!-- Google Font — defer load, fallback system font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"/></noscript>

  <script>
  /* ════════════════════════════════════════════════════════
     KONFIGURASI
  ═════════════════════════════════════════════════════════ */
  const AD_CONFIG = {
    allAds: false,
    gridPageAds:  { nativeBanner: true },
    videoPageAds: { nativeBanner: true },
    useDirect:    false,
    usePopunder:  false,
    gridBannerAfterRow:  1,
    gridColumnsOnMobile: 2,
    links: {
      direct:   "https://mediaindonesia.com",
      popunder: "https://google.com",
    },
    nativeBannerHTML: `
      <div style="display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#c00,#e00 60%,#f52);padding:14px 40px 14px 14px;border-radius:10px;min-height:90px;font-family:'Segoe UI',sans-serif;cursor:pointer;width:100%;box-sizing:border-box;" onclick="window.open('https://google.com','_blank')">
        <div style="flex-shrink:0;text-align:center;color:#ffdd00;font-size:11px;font-weight:800;line-height:1.2;">CONTOH<br>IKLAN</div>
        <div style="flex-grow:1;">
          <div style="color:#fff;font-size:18px;font-weight:900;text-transform:uppercase;line-height:1.2;">IKLAN NATIVE BANNER</div>
          <div style="color:rgba(255,255,255,0.85);font-size:12px;margin-top:4px;">Pasang kode iklan native Anda di sini</div>
        </div>
        <div style="flex-shrink:0;background:#ffdd00;color:#c00;font-size:11px;font-weight:900;padding:6px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap;">PELAJARI</div>
      </div>`
  };

  const PLAY_AD_CONFIG = {
    enablePlayButtonDirectAds: false,
    adUrl:            "https://mediaindonesia.com",
    adStartFromVideo: 2,
  };

  /* ════════════════════════════════════════════════════════
     STATE
  ═════════════════════════════════════════════════════════ */
  let videoWatchCount  = 0;
  let playCounter      = 0;
  let videoDatabaseEN  = [];
  let videoDatabaseID  = [];
  let videoDatabaseALL = [];
  let staticGridSlugs  = [];   // dari static-grid.json (diisi clean-db.js)

  /* ════════════════════════════════════════════════════════
     LAZY IMAGE OBSERVER
  ═════════════════════════════════════════════════════════ */
  let imgObserver;

  function loadImg(img) {
    const src = img.getAttribute('data-src');
    if (!src) return;
    img.removeAttribute('data-src');
    img.onload  = () => { if (img.parentNode) img.parentNode.classList.remove('loading'); };
    img.onerror = () => { if (img.parentNode) img.parentNode.classList.remove('loading'); };
    img.src = src; // set src SETELAH onload dipasang
  }

  function initImageObserver() {
    if (!('IntersectionObserver' in window)) return;
    imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          loadImg(entry.target);
          imgObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '500px 0px', threshold: 0 });
  }

  function observeLazyImgs(container) {
    const lazyImgs = container.querySelectorAll('img[data-src]');
    if (!imgObserver) {
      // Fallback: IntersectionObserver tidak ada, load semua langsung
      lazyImgs.forEach(loadImg);
      return;
    }
    lazyImgs.forEach(img => {
      // Jika sudah dalam viewport saat dipasang, load langsung
      const rect = img.getBoundingClientRect();
      if (rect.top < window.innerHeight + 600) {
        loadImg(img);
      } else {
        imgObserver.observe(img);
      }
    });
  }

  /* ════════════════════════════════════════════════════════
     HELPERS
  ═════════════════════════════════════════════════════════ */
  function updateHtmlLang() {
    document.getElementById('html-root').setAttribute('lang', 'en');
    const ml = document.getElementById('meta-content-language');
    if (ml) ml.setAttribute('content', 'en');
    const og = document.querySelector('meta[property="og:locale"]');
    if (og) og.setAttribute('content', 'en_US');
  }

  function updateCanonical(slug, source) {
    let c = document.getElementById('dynamic-canonical');
    if (source === 'nofollow') { if (c) c.remove(); return; }
    if (!c) { c = document.createElement('link'); c.id = 'dynamic-canonical'; c.rel = 'canonical'; document.head.appendChild(c); }
    c.href = (!slug || slug === 'home') ? 'https://www.trend4genz.fun/' : window.location.origin + window.location.pathname + '?v=' + slug;
  }

  function updateRobotsBySource(source) {
    let tag = document.querySelector('meta[name="robots"]');
    if (!tag) { tag = document.createElement('meta'); tag.setAttribute('name','robots'); document.head.appendChild(tag); }
    tag.setAttribute('content', source === 'nofollow' ? 'noindex, nofollow' : 'index, follow');
  }

  function seoUrl(text) {
    if (!text) return '';
    if (text.includes('-')) return text;
    return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
  }

  function getCurrentSlug() { return new URLSearchParams(window.location.search).get('v'); }

  function navigateTo(slug) {
    const video = videoDatabaseALL.find(v => v.slug === slug || seoUrl(v.title) === slug);
    if (!video) return;
    history.pushState({}, '', window.location.pathname + '?v=' + video.slug);
    router();
  }

  function buildNativeBanner(extraClass) {
    if (!AD_CONFIG.allAds) return '';
    return `<div class="native-banner-wrap ${extraClass||''}"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'" title="Tutup">✕</div><div style="width:100%;padding:0;">${AD_CONFIG.nativeBannerHTML}</div></div>`;
  }

  function runAd(type) {
    if (!AD_CONFIG.allAds) return;
    if (type === 'pop'    && AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder,'_blank');
    if (type === 'direct' && AD_CONFIG.useDirect)   window.open(AD_CONFIG.links.direct,'_blank');
  }

  function handleBrandClick()   { runAd('pop'); history.pushState({},'',window.location.pathname); router(); }
  function handleSpecialOffer() { if (AD_CONFIG.allAds && AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct,'_blank'); }

  /* ════════════════════════════════════════════════════════
     LOAD DATABASE — paralel + static-grid.json
  ═════════════════════════════════════════════════════════ */
  async function loadDatabases() {
    try {
      const [resEN, resID, resSG] = await Promise.all([
        fetch('./db-en.json'),
        fetch('./db-id.json'),
        fetch('./static-grid.json').catch(() => null) // optional
      ]);
      videoDatabaseEN  = (await resEN.json()).map(v => ({ ...v, source: v.source || 'seo' }));
      videoDatabaseID  = (await resID.json()).map(v => ({ ...v, source: v.source || 'nofollow' }));

      if (resSG) {
        try { staticGridSlugs = await resSG.json(); } catch(e) { staticGridSlugs = []; }
      }

      // ALL = EN + ID, shuffle sekali
      videoDatabaseALL = [...videoDatabaseEN, ...videoDatabaseID].sort(() => 0.5 - Math.random());
    } catch(e) {
      document.getElementById('app').innerHTML =
        '<div class="loading-screen"><p style="color:#ff032d;">❌ Gagal memuat database. Coba refresh.</p></div>';
      throw e;
    }
  }

  /* ════════════════════════════════════════════════════════
     RENDER THUMBNAIL (lazy)
     isEager = true → load langsung (above the fold, ≤4 item pertama)
  ═════════════════════════════════════════════════════════ */
  function thumbHTML(youtubeId, title, isEager) {
    const src = `https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg`;
    if (isEager) {
      // Load langsung, tanpa shimmer
      return `<div class="thumb-wrap"><img src="${src}" alt="${title}" width="320" height="180" fetchpriority="high" decoding="async"/></div>`;
    }
    // .loading = tampilkan shimmer; dihapus JS setelah gambar diload
    return `<div class="thumb-wrap loading"><img data-src="${src}" alt="${title}" width="320" height="180" decoding="async"/></div>`;
  }

  /* ════════════════════════════════════════════════════════
     RENDER GRID — Semua video dirender sekaligus,
     thumbnail lazy-load satu per satu saat scroll
  ═════════════════════════════════════════════════════════ */
  function renderGrid(container, data) {
    const cols             = window.innerWidth >= 992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
    const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow + 1) * cols - 1;
    const showBanner       = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

    let gridItems = '';
    for (let i = 0; i < data.length; i++) {
      const v            = data[i];
      const isEager      = i < 4; // hanya 4 card pertama eager (LCP)
      const nofollowAttr = v.source === 'nofollow' ? ' rel="nofollow"' : '';
      gridItems += `
        <a href="?v=${v.slug}"${nofollowAttr} class="video-card" onclick="handleNavigation(event,'${v.slug}')">
          ${thumbHTML(v.youtubeId, v.title, isEager)}
          <div class="video-card-title">${v.title}</div>
        </a>`;
      if (showBanner && i === insertAfterIndex)
        gridItems += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    }

    container.className = 'main-content';
    container.innerHTML = `
      <h5 class="section-title">🔥 TRENDING VIDEO</h5>
      <div class="video-grid">${gridItems}</div>
    `;

    observeLazyImgs(container);
  }

  /* ════════════════════════════════════════════════════════
     VIDEO PAGE
  ═════════════════════════════════════════════════════════ */
  function updateMetaTags(video) {
    const title       = video.title + ' | Trend4GenZ';
    const description = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160) : video.title;
    const image       = 'https://img.youtube.com/vi/' + video.youtubeId + '/maxresdefault.jpg';
    const url         = window.location.href;
    document.title    = title;
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', description);
    const ogMap = {
      'og-type':'video.other','og-title':title,'og-description':description,
      'og-url':url,'og-image':image,'og-image-width':'1280',
      'og-image-height':'720','og-image-alt':video.title
    };
    Object.entries(ogMap).forEach(([id,val]) => { const el = document.getElementById(id); if (el) el.setAttribute('content',val); });
    const ex = document.getElementById('schema-video');
    if (ex) ex.remove();
    const s = document.createElement('script');
    s.id = 'schema-video'; s.type = 'application/ld+json';
    s.textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"VideoObject","name":video.title,"description":description,
      "uploadDate":video.uploadDate || new Date().toISOString().substring(0,19)+'+00:00',
      "thumbnailUrl":[
        "https://img.youtube.com/vi/"+video.youtubeId+"/maxresdefault.jpg",
        "https://img.youtube.com/vi/"+video.youtubeId+"/hqdefault.jpg",
        "https://img.youtube.com/vi/"+video.youtubeId+"/mqdefault.jpg"
      ],
      "embedUrl":"https://www.youtube.com/embed/"+video.youtubeId,"url":url,
      "inLanguage":video.source==='nofollow'?"id":"en",
      "publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun","logo":{"@type":"ImageObject","url":"https://www.trend4genz.fun/logo.png"}}
    });
    document.head.appendChild(s);
  }

  function handlePlay(youtubeId) {
    playCounter++;
    const adAktif = PLAY_AD_CONFIG.enablePlayButtonDirectAds && videoWatchCount >= PLAY_AD_CONFIG.adStartFromVideo && playCounter === 1;
    if (adAktif) window.open(PLAY_AD_CONFIG.adUrl,'_blank');
    document.getElementById('player-box').innerHTML =
      '<iframe src="https://www.youtube.com/embed/'+youtubeId+'?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen loading="lazy"></iframe>'+
      '<div class="video-mask mask-top"></div>'+
      '<div class="video-mask mask-bottom"></div>'+
      '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
  }

  function toggleFullScreen() {
    const elem = document.getElementById('player-box');
    const icon = document.querySelector('#fs-btn i');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) elem.requestFullscreen(); else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      if (icon) icon.className = 'fas fa-compress';
    } else {
      if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      if (icon) icon.className = 'fas fa-expand';
    }
  }

  function renderVideo(container, v) {
    updateMetaTags(v);
    updateRobotsBySource(v.source);
    updateCanonical(v.slug, v.source);
    document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el => el.remove());
    videoWatchCount++; playCounter = 0;

    const related = videoDatabaseALL.filter(item => item.slug !== v.slug).sort(() => 0.5 - Math.random()).slice(0,8);
    const showVideoBanner = AD_CONFIG.allAds && AD_CONFIG.videoPageAds.nativeBanner;

    // Thumbnail maxresdefault untuk video page (hero) — eager load
    const heroSrc = `https://img.youtube.com/vi/${v.youtubeId}/maxresdefault.jpg`;

    container.className = 'main-content video-page-container';
    container.style.padding = '0';
    container.innerHTML = `
      <div class="player-container" id="player-box">
        <div class="play-overlay" onclick="handlePlay('${v.youtubeId}')">
          <svg class="play-icon-svg" viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg"><circle cx="42" cy="42" r="42" fill="rgba(0,0,0,0.5)"/><polygon points="34,26 62,42 34,58" fill="#ff032d"/></svg>
          <div style="margin-top:10px;font-weight:bold;font-size:0.85rem;">TAP TO WATCH</div>
        </div>
        <img src="${heroSrc}" style="width:100%;height:100%;object-fit:cover;" alt="${v.title}" fetchpriority="high"/>
      </div>
      <div class="info-section">
        <h1 style="font-size:1.15rem;font-weight:800;margin:14px 0 14px;">${v.title}</h1>
        <div class="dual-action-wrap">
          <button class="home-split-btn" onclick="handleBrandClick()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            HOME
          </button>
          <button class="offer-split-btn" onclick="handleSpecialOffer()">⚡ More Info 🔥</button>
        </div>
        ${showVideoBanner ? buildNativeBanner() : ''}
        <div class="summary-box"><div class="summary-text">${v.summary}</div></div>
        <div style="display:none;">${v.tags ? v.tags.join(', ') : ''}</div>
        <div class="rec-title">MORE VIDEOS</div>
        <div class="recommendation-slider" id="rec-slider">
          ${related.map((r,i) => `
            <div class="slider-item" onclick="navigateTo('${r.slug}')">
              ${thumbHTML(r.youtubeId, r.title, i < 3)}
              <p>${r.title}</p>
            </div>`).join('')}
        </div>
      </div>`;

    observeLazyImgs(container);
  }

  /* ════════════════════════════════════════════════════════
     SEARCH
  ═════════════════════════════════════════════════════════ */
  function initSearch() {
    const input       = document.getElementById('searchInput');
    const searchBtn   = document.getElementById('searchBtn');
    const suggestions = document.getElementById('searchSuggestions');
    if (!input || !searchBtn || !suggestions) return;

    let activeIndex = -1;

    input.addEventListener('input', () => {
      const val = input.value.trim().toLowerCase();
      activeIndex = -1;
      if (val.length < 1) { hideSuggestions(); return; }
      const matches = videoDatabaseALL.filter(v => v.title.toLowerCase().includes(val)).slice(0,7);
      if (matches.length === 0) {
        suggestions.innerHTML = `<div class="suggestion-empty">No results for "<b>${val}</b>"</div>`;
        suggestions.classList.add('show'); return;
      }
      function hl(text, q) {
        return text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<em>$1</em>');
      }
      suggestions.innerHTML = matches.map((v,i) => `
        <div class="suggestion-item" data-slug="${v.slug}" data-index="${i}" role="option">
          <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" loading="lazy" alt="${v.title}" width="52" height="30"/>
          <span>${hl(v.title, val)}</span>
        </div>`).join('');
      suggestions.classList.add('show');
      suggestions.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('mousedown', e => { e.preventDefault(); const s = item.getAttribute('data-slug'); input.value=''; hideSuggestions(); navigateTo(s); });
      });
    });

    input.addEventListener('keydown', e => {
      const items = suggestions.querySelectorAll('.suggestion-item');
      if (e.key==='ArrowDown'){e.preventDefault();activeIndex=Math.min(activeIndex+1,items.length-1);updateActive(items);}
      else if(e.key==='ArrowUp'){e.preventDefault();activeIndex=Math.max(activeIndex-1,-1);updateActive(items);}
      else if(e.key==='Enter'){if(activeIndex>=0&&items[activeIndex]){const s=items[activeIndex].getAttribute('data-slug');input.value='';hideSuggestions();navigateTo(s);}else doSearch();}
      else if(e.key==='Escape'){hideSuggestions();input.blur();}
    });

    function updateActive(items){items.forEach((item,i)=>item.classList.toggle('active',i===activeIndex));}
    document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))hideSuggestions();});
    searchBtn.addEventListener('click', doSearch);

    function hideSuggestions(){suggestions.classList.remove('show');suggestions.innerHTML='';activeIndex=-1;}
  }

  function doSearch() {
    const input = document.getElementById('searchInput');
    const suggestions = document.getElementById('searchSuggestions');
    if (!input) return;
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    if (suggestions){suggestions.classList.remove('show');suggestions.innerHTML='';}
    const results = videoDatabaseALL.filter(v => v.title.toLowerCase().includes(val));
    renderGrid(document.getElementById('app'), results);
    document.getElementById('main-navbar').classList.remove('video-mode');
  }

  function handleNavigation(event, slug){event.preventDefault();navigateTo(slug);}

  /* ════════════════════════════════════════════════════════
     ROUTER
  ═════════════════════════════════════════════════════════ */
  async function router() {
    const app    = document.getElementById('app');
    const navbar = document.getElementById('main-navbar');
    const slug   = getCurrentSlug();

    updateHtmlLang();
    updateRobotsBySource('seo');

    if (!slug || slug === 'home') {
      navbar.classList.remove('video-mode');
      app.style.padding = '';

      // Pilih dataset untuk grid home:
      // Jika static-grid.json ada & tidak kosong → gunakan urutan itu
      // Sehingga thumbnail yang di-render selalu berbeda tiap deploy (di-random oleh clean-db.js)
      let homeData;
      if (staticGridSlugs.length > 0) {
        const slugSet = new Set(staticGridSlugs);
        // tampilkan static-grid dulu, sisanya di-append
        const staticVideos  = staticGridSlugs.map(s => videoDatabaseALL.find(v => v.slug === s)).filter(Boolean);
        const restVideos    = videoDatabaseALL.filter(v => !slugSet.has(v.slug));
        homeData = [...staticVideos, ...restVideos];
      } else {
        homeData = videoDatabaseALL;
      }

      renderGrid(app, homeData);
      updateCanonical('home', 'seo');
    } else {
      const video = videoDatabaseALL.find(v => v.slug === slug || seoUrl(v.title) === slug);
      if (video) {
        navbar.classList.add('video-mode');
        renderVideo(app, video);
        updateMetaTags(video);
      } else {
        history.replaceState({},'',window.location.pathname);
        navbar.classList.remove('video-mode');
        document.title = 'Trend4GenZ - Streaming';
        renderGrid(app, videoDatabaseALL);
        updateCanonical('home','seo');
      }
    }
    window.scrollTo(0,0);
  }

  /* ════════════════════════════════════════════════════════
     INIT
  ═════════════════════════════════════════════════════════ */
  window.addEventListener('popstate', router);
  window.addEventListener('load', async () => {
    initImageObserver();
    await loadDatabases();
    initSearch();
    router();
  });
  </script>
</body>
