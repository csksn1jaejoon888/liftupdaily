<script>

      <div style="flex-shrink:0;text-align:center;color:#ffdd00;font-size:11px;font-weight:800;line-height:1.2;">CONTOH<br>IKLAN</div>
      <div style="flex-grow:1;">
        <div style="color:#fff;font-size:18px;font-weight:900;letter-spacing:0.5px;text-transform:uppercase;line-height:1.2;">IKLAN NATIVE BANNER</div>
        <div style="color:rgba(255,255,255,0.85);font-size:12px;margin-top:4px;">Pasang kode iklan native Anda di sini</div>
      </div>
      <div style="flex-shrink:0;background:#ffdd00;color:#c00;font-size:11px;font-weight:900;padding:6px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap;">PELAJARI</div>
    </div>
  `
};

// ── IKLAN TOMBOL PLAY ─────────────────────────────────
// enablePlayButtonDirectAds: true  → iklan aktif
// adUrl: ganti dengan URL direct link iklan Anda
// adStartFromVideo: 2 → iklan mulai aktif dari video ke-2
//                       (video ke-1 selalu langsung play, iklan belum jalan)
const PLAY_AD_CONFIG = {
  enablePlayButtonDirectAds: true,
  adUrl:           "https://mediaindonesia.com",
  adStartFromVideo: 2,
};
// ─────────────────────────────────────────────────────

const SEO_CONFIG = { autoGeoLanguage: true };

let currentLang = 'id';
let videoWatchCount = 0;  // hitung total video yang sudah dibuka (bukan play)
let playCounter    = 0;   // hitung play dalam 1 sesi video
let videoDatabaseEN = [];
let videoDatabaseID = [];

// ═══════════════════════════════════════════════════════
//  BLOKIR GOOGLE TRANSLATE POPUP
// ═══════════════════════════════════════════════════════
(function blockGoogleTranslate() {
  // Tambahkan class ke html agar Google Translate tidak auto-detect
  document.documentElement.setAttribute('translate', 'no');
  document.documentElement.classList.add('notranslate');
})();

// ═══════════════════════════════════════════════════════
//  BOT REDIRECT
// ═══════════════════════════════════════════════════════
(function() {
  const ua = navigator.userAgent.toLowerCase();
  const isBot = ua.includes('facebookexternalhit') || ua.includes('twitterbot') ||
    ua.includes('whatsapp') || ua.includes('linkedinbot') || ua.includes('telegrambot');
  if (isBot) {
    const params = new URLSearchParams(window.location.search);
    window.location.replace('https://og.trend4genz.fun/api/proxy?v=' + (params.get('v')||'') + '&lang=' + (params.get('lang')||'id'));
  }
})();

// ═══════════════════════════════════════════════════════
//  UPDATE html lang + meta content-language DINAMIS
// ═══════════════════════════════════════════════════════
function updateHtmlLang(lang) {
  // Update <html lang="...">
  document.getElementById('html-root').setAttribute('lang', lang === 'id' ? 'id' : 'en');
  // Update meta content-language
  const metaLang = document.getElementById('meta-content-language');
  if (metaLang) metaLang.setAttribute('content', lang === 'id' ? 'id' : 'en');
  // Update og:locale
  const ogLocale = document.querySelector('meta[property="og:locale"]');
  if (ogLocale) ogLocale.setAttribute('content', lang === 'id' ? 'id_ID' : 'en_US');
}

// ═══════════════════════════════════════════════════════
//  UPDATE CANONICAL DINAMIS
// ═══════════════════════════════════════════════════════
function updateCanonical(slug, lang) {
  let c = document.getElementById('dynamic-canonical');
  if (!c) {
    c = document.createElement('link');
    c.id  = 'dynamic-canonical';
    c.rel = 'canonical';
    document.head.appendChild(c);
  }
  if (!slug || slug === 'home') {
    // Halaman home lang=en → canonical clean, lang=id → noindex (canonical tidak perlu)
    c.href = lang === 'en'
      ? 'https://www.trend4genz.fun/?lang=en'
      : 'https://www.trend4genz.fun/?lang=id';
  } else {
    c.href = window.location.origin + window.location.pathname + '?v=' + slug + '&lang=' + lang;
  }
}

// ═══════════════════════════════════════════════════════
//  UPDATE ROBOTS META DINAMIS
// ═══════════════════════════════════════════════════════
function updateRobots(lang) {
  let robotsTag = document.querySelector('meta[name="robots"]');
  if (!robotsTag) {
    robotsTag = document.createElement('meta');
    robotsTag.setAttribute('name', 'robots');
    document.head.appendChild(robotsTag);
  }
  robotsTag.setAttribute('content', lang === 'id' ? 'noindex, nofollow' : 'index, follow');
}

// ═══════════════════════════════════════════════════════
//  LOAD DATABASE
// ═══════════════════════════════════════════════════════
async function loadDatabases() {
  try {
    const [resEN, resID] = await Promise.all([fetch('./db-en.json'), fetch('./db-id.json')]);
    videoDatabaseEN = await resEN.json();
    videoDatabaseID = await resID.json();
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><p style="color:#ff032d;">❌ Gagal memuat database.</p></div>';
    throw e;
  }
}

function getUrlParams()        { return new URLSearchParams(window.location.search); }
function getCurrentSlug()     { return getUrlParams().get('v'); }
function getCurrentLangParam(){ return getUrlParams().get('lang'); }

// ═══════════════════════════════════════════════════════
//  GEO DETECT — redirect orang Indonesia ke lang=id
// ═══════════════════════════════════════════════════════
async function detectGeoLanguage() {
  try {
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    return d.country_code === 'ID' ? 'id' : 'en';
  } catch(e) {
    return 'id';
  }
}

function updateHreflang(video) {
  document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el => el.remove());
  if (!video) return;
  const baseUrl = window.location.origin + window.location.pathname;
  const videoID = videoDatabaseID.find(v => v.youtubeId === video.youtubeId) || video;
  const videoEN = videoDatabaseEN.find(v => v.youtubeId === video.youtubeId) || video;
  const urlID   = baseUrl + '?v=' + videoID.slug + '&lang=id';
  const urlEN   = baseUrl + '?v=' + videoEN.slug + '&lang=en';
  const mk = (hl, href) => {
    const l = document.createElement('link');
    l.rel = 'alternate'; l.hreflang = hl; l.href = href;
    document.head.appendChild(l);
  };
  mk('id', urlID); mk('en', urlEN); mk('x-default', urlEN);
}

function seoUrl(text) {
  if (!text) return '';
  if (text.includes('-')) return text;
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}

function navigateTo(slug) {
  const db    = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  const video = db.find(v => v.slug === slug || seoUrl(v.title) === slug);
  if (!video) return;
  const url = window.location.pathname + '?lang=' + currentLang + '&v=' + video.slug;
  history.pushState({}, '', url);
  router();
}

function buildNativeBanner(extraClass) {
  if (!AD_CONFIG.allAds) return '';
  return `
    <div class="native-banner-wrap ${extraClass||''}" id="native-banner-${Date.now()}">
      <div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'" title="Tutup">✕</div>
      <div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div>
    </div>`;
}

function runAd(type) {
  if (!AD_CONFIG.allAds) return;
  if (type === 'pop'    && AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder, '_blank');
  if (type === 'direct' && AD_CONFIG.useDirect)   window.open(AD_CONFIG.links.direct,   '_blank');
}

function changeLang(lang) {
  currentLang = lang;
  const currentSlug = getCurrentSlug();
  let targetSlug = null;
  if (currentSlug) {
    const dbTarget = lang === 'id' ? videoDatabaseID : videoDatabaseEN;
    const dbSource = lang === 'id' ? videoDatabaseEN : videoDatabaseID;
    const videoSource = dbSource.find(v => v.slug === currentSlug || seoUrl(v.title) === currentSlug);
    if (videoSource) {
      const videoTarget = dbTarget.find(v => v.youtubeId === videoSource.youtubeId);
      targetSlug = videoTarget ? videoTarget.slug : videoSource.slug;
    } else {
      targetSlug = currentSlug;
    }
  }
  let url = window.location.pathname + '?lang=' + lang;
  if (targetSlug) url += '&v=' + targetSlug;
  history.pushState({}, '', url);
  router();
}

function handleBrandClick() {
  runAd('pop');
  // Kembali ke home — tetap pakai lang saat ini (ID tetap ke grid ID)
  history.pushState({}, '', window.location.pathname + '?lang=' + currentLang);
  router();
}

function handleSpecialOffer() {
  if (AD_CONFIG.allAds && AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct, '_blank');
}

function initSearch() {
  const si = document.getElementById('searchInput');
  const sb = document.getElementById('searchBtn');
  if (!si || !sb) return;
  si.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  sb.addEventListener('click', doSearch);
}

function doSearch() {
  const si  = document.getElementById('searchInput');
  if (!si) return;
  const val = si.value.toLowerCase();
  const db  = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  if (!db || !Array.isArray(db)) return;
  renderGrid(document.getElementById('app'), db.filter(v => v.title.toLowerCase().includes(val)));
}

// ═══════════════════════════════════════════════════════
//  HANDLE PLAY — iklan mulai dari video ke-N
// ═══════════════════════════════════════════════════════
function handlePlay(youtubeId) {
  playCounter++;

  // Cek apakah iklan harus aktif:
  // - PLAY_AD_CONFIG.enablePlayButtonDirectAds harus true
  // - videoWatchCount >= adStartFromVideo (sudah masuk video ke-2 dst)
  // - playCounter === 1 (klik pertama di video ini)
  const adAktif = PLAY_AD_CONFIG.enablePlayButtonDirectAds
    && videoWatchCount >= PLAY_AD_CONFIG.adStartFromVideo
    && playCounter === 1;

  if (adAktif) {
    // Buka iklan di tab baru, lalu tetap jalankan player
    window.open(PLAY_AD_CONFIG.adUrl, '_blank');
  }

  // Player selalu langsung jalan, iklan tidak menghalangi
  document.getElementById('player-box').innerHTML =
    '<iframe src="https://www.youtube.com/embed/' + youtubeId +
    '?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1"' +
    ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>' +
    '<div class="video-mask mask-top"></div>' +
    '<div class="video-mask mask-bottom"></div>' +
    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
}

function toggleFullScreen() {
  const elem = document.getElementById('player-box');
  const icon = document.querySelector('#fs-btn i');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    icon.className = 'fas fa-compress';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    icon.className = 'fas fa-expand';
  }
}

function renderGrid(container, data) {
  const cols             = window.innerWidth >= 992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const afterRow         = AD_CONFIG.gridBannerAfterRow;
  const insertAfterIndex = (afterRow + 1) * cols - 1;
  const showGridBanner   = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  let gridItems = data.map((v, i) => {
    let html = `
      <a href="?v=${v.slug}&lang=${currentLang}" class="video-card-link" style="text-decoration:none;color:inherit;"
         onclick="handleNavigation(event,'${v.slug}')">
        <div class="video-card">
          <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title}" loading="lazy"/>
          <div class="video-card-title">${v.title}</div>
        </div>
      </a>`;
    if (showGridBanner && i === insertAfterIndex) {
      html += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    }
    return html;
  }).join('');

  container.className = 'main-content';
  container.innerHTML =
    '<h5 class="mb-3" style="color:#98FB98">🔥 TRENDING VIDEO</h5>' +
    '<div class="video-grid">' + gridItems + '</div>';
}

function handleNavigation(event, slug) {
  event.preventDefault();
  navigateTo(slug);
}

function setOGTag(property, content) {
  let tag = document.querySelector('meta[property="' + property + '"]');
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute('property', property); document.head.appendChild(tag); }
  tag.setAttribute('content', content);
}
function setTwitterTag(name, content) {
  let tag = document.querySelector('meta[name="' + name + '"]');
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute('name', name); document.head.appendChild(tag); }
  tag.setAttribute('content', content);
}

function updateMetaTags(video) {
  const title       = video.title + " | Trend4GenZ";
  const description = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160) : video.title;
  const summaryClean= video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,150) : video.title;
  const tags        = video.tags ? video.tags.slice(0,5).join(',') : '';
  const image       = 'https://og.trend4genz.fun/api/og?title=' + encodeURIComponent(video.title) +
    '&summary=' + encodeURIComponent(summaryClean) + '&tags=' + encodeURIComponent(tags);
  const url = window.location.href;

  document.title = title;
  setTwitterTag('description', description);
  setOGTag('og:title', title); setOGTag('og:description', description); setOGTag('og:image', image);
  setOGTag('og:image:width','1200'); setOGTag('og:image:height','630'); setOGTag('og:url', url);
  setOGTag('og:type','video.other');
  setOGTag('og:video','https://www.youtube.com/embed/' + video.youtubeId);
  setOGTag('og:video:type','text/html');
  setTwitterTag('twitter:card','summary_large_image');
  setTwitterTag('twitter:title', title);
  setTwitterTag('twitter:description', description);
  setTwitterTag('twitter:image', image);

  const existingSchema = document.getElementById('schema-video');
  if (existingSchema) existingSchema.remove();
  const schema = document.createElement('script');
  schema.id   = 'schema-video'; schema.type = 'application/ld+json';
  schema.textContent = JSON.stringify({
    "@context":"https://schema.org","@type":"VideoObject","name":video.title,
    "description":description,
    "thumbnailUrl":["https://img.youtube.com/vi/"+video.youtubeId+"/maxresdefault.jpg","https://img.youtube.com/vi/"+video.youtubeId+"/hqdefault.jpg"],
    "embedUrl":"https://www.youtube.com/embed/"+video.youtubeId,"url":url,
    "publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun"}
  });
  document.head.appendChild(schema);
}

function renderVideo(container, v) {
  updateMetaTags(v);
  updateCanonical(v.slug, currentLang);
  updateHreflang(v);

  // Hitung video yang dibuka (untuk sistem iklan play)
  videoWatchCount++;
  playCounter = 0;

  container.className = 'main-content video-page-container';
  const db      = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  const related = db.filter(item => item.slug !== v.slug).sort(() => 0.5 - Math.random()).slice(0,8);
  const showVideoBanner = AD_CONFIG.allAds && AD_CONFIG.videoPageAds.nativeBanner;

  container.innerHTML =
    '<div class="player-container" id="player-box">' +
    '<div class="play-overlay" onclick="handlePlay(\'' + v.youtubeId + '\')">' +
    '<i class="fas fa-play-circle"></i>' +
    '<div id="play-msg" style="margin-top:10px;font-weight:bold;">TAP TO WATCH</div>' +
    '</div>' +
    '<img src="https://img.youtube.com/vi/' + v.youtubeId + '/maxresdefault.jpg" style="width:100%;height:100%;object-fit:cover;"/>' +
    '</div>' +
    '<div class="mobile-only-notice">📱 Full Screen Wide? Click [:] at the top ↗️ then select Open in Browser</div>' +
    '<div class="info-section" style="padding:15px;">' +
    '<h1 style="font-size:1.2rem;font-weight:800;margin:15px 0;">' + v.title + '</h1>' +
    '<div class="dual-action-wrap">' +
    '<button class="home-split-btn" onclick="handleBrandClick()"><i class="fas fa-home"></i> HOME</button>' +
    '<button class="offer-split-btn" onclick="handleSpecialOffer()"><i class="fas fa-bolt"></i> SPECIAL OFFER 🔥</button>' +
    '</div>' +
    (showVideoBanner ? buildNativeBanner() : '') +
    '<div class="summary-box"><div class="summary-text">' + v.summary + '</div></div>' +
    '<div style="display:none;">' + (v.tags ? v.tags.join(', ') : '') + '</div>' +
    '<h6 class="mt-4 mb-3" style="color:#98FB98">MORE VIDEOS</h6>' +
    '<div class="recommendation-slider">' +
    related.map(r =>
      '<div class="slider-item" onclick="navigateTo(\'' + r.slug + '\')">' +
      '<img src="https://img.youtube.com/vi/' + r.youtubeId + '/mqdefault.jpg" loading="lazy"/>' +
      '<p>' + r.title + '</p>' +
      '</div>'
    ).join('') +
    '</div></div>';
}

// ═══════════════════════════════════════════════════════
//  ROUTER UTAMA
// ═══════════════════════════════════════════════════════
async function router() {
  const app    = document.getElementById('app');
  const navbar = document.getElementById('main-navbar');
  let slug = getCurrentSlug();
  let lang = getCurrentLangParam();

  // Jika tidak ada ?lang= di URL → deteksi geo
  if (!lang) lang = SEO_CONFIG.autoGeoLanguage ? await detectGeoLanguage() : 'id';
  currentLang = lang;

  // Update semua tag terkait bahasa sekaligus
  updateHtmlLang(lang);
  updateRobots(lang);

  document.getElementById('btn-id').className = lang === 'id' ? 'btn-lang active' : 'btn-lang';
  document.getElementById('btn-en').className = lang === 'en' ? 'btn-lang active' : 'btn-lang';

  const db = lang === 'id' ? videoDatabaseID : videoDatabaseEN;

  if (!slug || slug === 'home') {
    navbar.classList.remove('video-mode');
    renderGrid(app, [...db].sort(() => 0.5 - Math.random()));
    updateCanonical('home', lang);
  } else {
    const video = db.find(v => v.slug === slug || seoUrl(v.title) === slug);
    if (video) {
      navbar.classList.add('video-mode');
      renderVideo(app, video);
      updateCanonical(video.slug, lang);
      updateMetaTags(video);
    } else {
      navbar.classList.remove('video-mode');
      document.title = "Trend4GenZ - Streaming";
      renderGrid(app, db);
      updateCanonical('home', lang);
    }
  }
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', router);
window.addEventListener('load', async () => {
  await loadDatabases();
  initSearch();
  router();
});
</script>
