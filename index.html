<script>
/* ══════════════════════════════════════════════════════

const AD_CONFIG = {

};
const PLAY_AD_CONFIG = { enablePlayButtonDirectAds:false, adUrl:'https://mediaindonesia.com', adStartFromVideo:2 };

/* ── State ── */
let videoWatchCount=0, playCounter=0;
let videoDatabaseEN=[], videoDatabaseID=[], videoDatabaseALL=[];
let staticGridSlugs=[], faLoaded=false;

/* ══════════════════════════════════════════════════════
   FONT AWESOME — dimuat hanya saat buka video page
══════════════════════════════════════════════════════ */
function loadFA() {
  if (faLoaded) return; faLoaded=true;
  const l=document.createElement('link');
  l.rel='stylesheet';
  l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';

}

/* ══════════════════════════════════════════════════════
   LAZY IMAGE
   Strategi: data-src + IntersectionObserver
   Fallback: load langsung jika IO tidak tersedia
══════════════════════════════════════════════════════ */
let io;
function initIO() {
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const img = e.target, src = img.dataset.src;
      if (src) { img.src = src; delete img.dataset.src; }
      io.unobserve(img);
    }
  }, { rootMargin:'500px 0px', threshold:0 });
}

function observeAll(root) {
  // Jalankan di rAF supaya DOM sudah final sebelum getBoundingClientRect
  requestAnimationFrame(() => {
    const vh = window.innerHeight;
    root.querySelectorAll('img[data-src]').forEach(img => {
      if (!io) { img.src=img.dataset.src; delete img.dataset.src; return; }
      // Gambar sudah dalam viewport + buffer 600px → load langsung (tidak perlu observer)
      const top = img.getBoundingClientRect().top;
      if (top < vh + 600) { img.src=img.dataset.src; delete img.dataset.src; }
      else io.observe(img);
    });
  });
}

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
const YT_THUMB = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const YT_HQ    = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

function makeThumb(id, alt, eager) {
  const src = YT_THUMB(id);
  if (eager) return `<div class="thumb-wrap"><img src="${src}" alt="${alt}" width="320" height="180" fetchpriority="high" decoding="async"/></div>`;
  return `<div class="thumb-wrap"><img data-src="${src}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'/%3E" alt="${alt}" width="320" height="180" decoding="async"/></div>`;
}

function seoUrl(t) {
  if (!t) return '';
  if (t.includes('-')) return t;
  return t.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}

function slug2video(slug) { return videoDatabaseALL.find(v=>v.slug===slug||seoUrl(v.title)===slug); }
function getSlug()        { return new URLSearchParams(location.search).get('v'); }

function go(slug) {
  const v = slug2video(slug);
  if (!v) return;
  history.pushState({},'',location.pathname+'?v='+v.slug);
  router();
}

function nav(e, slug) { e.preventDefault(); go(slug); }

function banner(cls) {
  if (!AD_CONFIG.allAds) return '';
  return `<div class="native-banner-wrap ${cls||''}"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'">✕</div><div>${AD_CONFIG.nativeBannerHTML}</div></div>`;
}

function runAd(t) {
  if (!AD_CONFIG.allAds) return;
  if (t==='pop'&&AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder,'_blank');
  if (t==='direct'&&AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct,'_blank');
}

function handleBrandClick()   { runAd('pop'); history.pushState({},'',location.pathname); router(); }
function handleSpecialOffer() { if (AD_CONFIG.allAds&&AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct,'_blank'); }

function updateCanonical(slug,source) {
  let c=document.getElementById('dynamic-canonical');
  if (source==='nofollow'){if(c)c.remove();return;}
  if(!c){c=document.createElement('link');c.id='dynamic-canonical';c.rel='canonical';document.head.appendChild(c);}
  c.href=(!slug||slug==='home')?'https://www.trend4genz.fun/':location.origin+location.pathname+'?v='+slug;
}

function updateRobots(s) {
  let t=document.querySelector('meta[name="robots"]');
  if(!t){t=document.createElement('meta');t.setAttribute('name','robots');document.head.appendChild(t);}
  t.setAttribute('content',s==='nofollow'?'noindex,nofollow':'index,follow');
}

function updateLang() {
  document.getElementById('html-root').setAttribute('lang','en');
  const ml=document.getElementById('meta-content-language'); if(ml) ml.setAttribute('content','en');
  const og=document.querySelector('meta[property="og:locale"]'); if(og) og.setAttribute('content','en_US');
}

/* ══════════════════════════════════════════════════════
   LOAD DATABASE — paralel fetch, tidak blocking render
   Skeleton grid sudah tampil di HTML sebelum ini jalan
══════════════════════════════════════════════════════ */
async function loadDatabases() {
  const [resEN, resID, resSG] = await Promise.all([
    fetch('./db-en.json'),
    fetch('./db-id.json'),
    fetch('./static-grid.json').catch(()=>null)
  ]);

  [videoDatabaseEN, videoDatabaseID] = await Promise.all([
    resEN.json().then(d=>d.map(v=>({...v,source:v.source||'seo'}))),
    resID.json().then(d=>d.map(v=>({...v,source:v.source||'nofollow'})))
  ]);

  if (resSG) { try { staticGridSlugs=await resSG.json(); } catch(_){} }

  videoDatabaseALL = [...videoDatabaseEN,...videoDatabaseID].sort(()=>0.5-Math.random());
}

/* ══════════════════════════════════════════════════════
   RENDER GRID — 1 innerHTML assignment = 1 reflow
══════════════════════════════════════════════════════ */
function renderGrid(container, data) {
  const cols  = innerWidth>=992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const bIdx  = (AD_CONFIG.gridBannerAfterRow+1)*cols-1;
  const showB = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  const p = ['<h5 class="section-title">🔥 TRENDING VIDEO</h5><div class="video-grid">'];
  for (let i=0; i<data.length; i++) {
    const v=data[i], nr=v.source==='nofollow'?' rel="nofollow"':'';
    p.push(`<a href="?v=${v.slug}"${nr} class="video-card" onclick="nav(event,'${v.slug}')">${makeThumb(v.youtubeId,v.title,i<4)}<div class="video-card-title">${v.title}</div></a>`);
    if (showB&&i===bIdx) p.push(`<div class="grid-full-span">${banner()}</div>`);
  }
  p.push('</div>');

  container.style.padding='15px';
  container.innerHTML=p.join('');
  observeAll(container);
}

/* ══════════════════════════════════════════════════════
   VIDEO PAGE
══════════════════════════════════════════════════════ */
function updateMeta(video) {
  const title = video.title+' | Trend4GenZ';
  const desc  = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160) : video.title;
  const img   = `https://i.ytimg.com/vi/${video.youtubeId}/maxresdefault.jpg`;
  const url   = location.href;
  document.title=title;
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',desc);
  const map={'og-type':'video.other','og-title':title,'og-description':desc,'og-url':url,'og-image':img,'og-image-width':'1280','og-image-height':'720','og-image-alt':video.title};
  for(const [id,val] of Object.entries(map)){const el=document.getElementById(id);if(el) el.setAttribute('content',val);}
  const ex=document.getElementById('schema-video'); if(ex) ex.remove();
  const s=document.createElement('script'); s.id='schema-video'; s.type='application/ld+json';
  s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"VideoObject","name":video.title,"description":desc,"uploadDate":video.uploadDate||new Date().toISOString().slice(0,19)+'+00:00',"thumbnailUrl":[`https://i.ytimg.com/vi/${video.youtubeId}/maxresdefault.jpg`,`https://i.ytimg.com/vi/${video.youtubeId}/hqdefault.jpg`,`https://i.ytimg.com/vi/${video.youtubeId}/mqdefault.jpg`],"embedUrl":`https://www.youtube.com/embed/${video.youtubeId}`,"url":url,"inLanguage":video.source==='nofollow'?'id':'en',"publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun","logo":{"@type":"ImageObject","url":"https://www.trend4genz.fun/logo.png"}}});
  document.head.appendChild(s);
}

function handlePlay(id) {
  playCounter++;
  if(PLAY_AD_CONFIG.enablePlayButtonDirectAds&&videoWatchCount>=PLAY_AD_CONFIG.adStartFromVideo&&playCounter===1) window.open(PLAY_AD_CONFIG.adUrl,'_blank');
  document.getElementById('player-box').innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe><div class="video-mask mask-top"></div><div class="video-mask mask-bottom"></div><div id="fs-btn" class="btn-fs-custom" onclick="toggleFS()"><i class="fas fa-expand"></i></div>`;
}

function toggleFS() {
  const el=document.getElementById('player-box'), ic=document.querySelector('#fs-btn i');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    if(ic) ic.className='fas fa-compress';
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    if(ic) ic.className='fas fa-expand';
  }
}

function renderVideo(container, v) {
  loadFA();
  updateMeta(v);
  updateRobots(v.source);
  updateCanonical(v.slug,v.source);
  document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el=>el.remove());
  videoWatchCount++; playCounter=0;

  const rel = videoDatabaseALL.filter(x=>x.slug!==v.slug).sort(()=>0.5-Math.random()).slice(0,8);
  const showB = AD_CONFIG.allAds&&AD_CONFIG.videoPageAds.nativeBanner;

  container.style.padding='0';
  container.innerHTML=`
    <div class="player-container" id="player-box">
      <div class="play-overlay" onclick="handlePlay('${v.youtubeId}')">
        <svg class="play-icon-svg" viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="rgba(0,0,0,0.5)"/><polygon points="34,26 62,42 34,58" fill="#ff032d"/></svg>
        <div style="margin-top:10px;font-weight:bold;font-size:0.85rem;">TAP TO WATCH</div>
      </div>
      <img src="${YT_HQ(v.youtubeId)}" style="width:100%;height:100%;object-fit:cover;" alt="${v.title}" fetchpriority="high" decoding="async"/>
    </div>
    <div class="info-section">
      <h1 style="font-size:1.15rem;font-weight:800;margin:14px 0;">${v.title}</h1>
      <div class="dual-action-wrap">
        <button class="home-split-btn" onclick="handleBrandClick()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> HOME</button>
        <button class="offer-split-btn" onclick="handleSpecialOffer()">⚡ More Info 🔥</button>
      </div>
      ${showB?banner():''}
      <div class="summary-box"><div class="summary-text">${v.summary||''}</div></div>
      <div style="display:none">${v.tags?v.tags.join(', '):''}</div>
      <div class="rec-title">MORE VIDEOS</div>
      <div class="recommendation-slider">${rel.map((r,i)=>`<div class="slider-item" onclick="go('${r.slug}')">${makeThumb(r.youtubeId,r.title,i<3)}<p>${r.title}</p></div>`).join('')}</div>
    </div>`;
  observeAll(container);
}

/* ══════════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════════ */
function initSearch() {
  const inp=document.getElementById('searchInput'), btn=document.getElementById('searchBtn'), sg=document.getElementById('searchSuggestions');
  if(!inp||!btn||!sg) return;
  let ai=-1;
  const hl=(t,q)=>t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<em>$1</em>');
  const hide=()=>{sg.classList.remove('show');sg.innerHTML='';ai=-1;};
  const setA=its=>its.forEach((e,i)=>e.classList.toggle('active',i===ai));

  inp.addEventListener('input',()=>{
    const v=inp.value.trim().toLowerCase(); ai=-1;
    if(!v){hide();return;}
    const hits=videoDatabaseALL.filter(x=>x.title.toLowerCase().includes(v)).slice(0,7);
    if(!hits.length){sg.innerHTML=`<div class="sug-empty">No results for "<b>${v}</b>"</div>`;sg.classList.add('show');return;}
    sg.innerHTML=hits.map(x=>`<div class="sug-item" data-slug="${x.slug}"><img src="${YT_THUMB(x.youtubeId)}" loading="lazy" alt="${x.title}" width="52" height="30"/><span>${hl(x.title,v)}</span></div>`).join('');
    sg.classList.add('show');
    sg.querySelectorAll('.sug-item').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();inp.value='';hide();go(el.dataset.slug);}));
  });

  inp.addEventListener('keydown',e=>{
    const its=sg.querySelectorAll('.sug-item');
    if(e.key==='ArrowDown'){e.preventDefault();ai=Math.min(ai+1,its.length-1);setA(its);}
    else if(e.key==='ArrowUp'){e.preventDefault();ai=Math.max(ai-1,-1);setA(its);}
    else if(e.key==='Enter'){if(ai>=0&&its[ai]){inp.value='';hide();go(its[ai].dataset.slug);}else doSearch();}
    else if(e.key==='Escape'){hide();inp.blur();}
  });

  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))hide();});
  btn.addEventListener('click',doSearch);
}

function doSearch() {
  const inp=document.getElementById('searchInput'), sg=document.getElementById('searchSuggestions');
  if(!inp) return;
  const v=inp.value.trim().toLowerCase(); if(!v) return;
  if(sg){sg.classList.remove('show');sg.innerHTML='';}
  renderGrid(document.getElementById('app'),videoDatabaseALL.filter(x=>x.title.toLowerCase().includes(v)));
  document.getElementById('main-navbar').classList.remove('video-mode');
}

/* ══════════════════════════════════════════════════════
   ROUTER
══════════════════════════════════════════════════════ */
async function router() {
  const app=document.getElementById('app'), nav=document.getElementById('main-navbar'), slug=getSlug();
  updateLang(); updateRobots('seo');

  if (!slug||slug==='home') {
    nav.classList.remove('video-mode');
    let data;
    if (staticGridSlugs.length) {
      const ss=new Set(staticGridSlugs);
      data=[...staticGridSlugs.map(s=>videoDatabaseALL.find(v=>v.slug===s)).filter(Boolean),...videoDatabaseALL.filter(v=>!ss.has(v.slug))];
    } else { data=videoDatabaseALL; }
    renderGrid(app, data);
    updateCanonical('home','seo');
  } else {
    const video=slug2video(slug);
    if(video){ nav.classList.add('video-mode'); renderVideo(app,video); }
    else{
      history.replaceState({},'',location.pathname);
      nav.classList.remove('video-mode');
      document.title='Trend4GenZ - Streaming';
      renderGrid(app,videoDatabaseALL);
      updateCanonical('home','seo');
    }
  }
  scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════
   INIT — skeleton sudah tampil, fetch DB di background
══════════════════════════════════════════════════════ */
window.addEventListener('popstate', router);

(async () => {
  initIO();
  // Cek dulu apakah ini video page — kalau iya, langsung tampilkan skeleton video
  const slug = getSlug();
  if (slug) {
    // Video page: ganti skeleton grid dengan skeleton player
    document.getElementById('app').innerHTML=`
      <div style="width:100%;aspect-ratio:16/9;background:#111;border-radius:12px;overflow:hidden;">
        <div class="sk-thumb" style="width:100%;height:100%;border-radius:0"></div>
      </div>
      <div style="padding:15px">
        <div class="sk-title" style="height:20px;margin:14px 0 8px;max-width:80%"></div>
        <div class="sk-title2" style="height:16px;margin-bottom:18px;max-width:60%"></div>
      </div>`;
  }
  // Fetch DB (tidak blocking — skeleton sudah tampil)
  try { await loadDatabases(); } catch(e) {
    document.getElementById('app').innerHTML='<div style="padding:30px;text-align:center;color:#ff032d;">❌ Gagal memuat database. Coba refresh.</div>';
    return;
  }
  initSearch();
  router();
})();
</script>
