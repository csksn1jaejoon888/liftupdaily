  <style>
    body { background-color: #212122; color: #f1f1f1; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

    /* =============================================
       NAVBAR SETTINGS — EDIT NILAI DI SINI
    ============================================= */

    /* — HOME navbar — */
    :root {
      --nav-home-bg:           #000000;       /* warna background navbar home */
      --nav-home-border-color: #98FB98;       /* warna garis bawah */
      --nav-home-border-show:  1.5px;         /* tebal garis (0px = hilang) */
      --nav-home-padding:      12px 15px;     /* padding navbar home */
      --nav-home-logo-color:   #98FB98;       /* warna teks logo */
      --nav-home-logo-size:    1.5rem;        /* ukuran teks logo */
      --nav-home-logo-show:    block;         /* block = tampil, none = hilang */
      --nav-home-lang-show:    flex;          /* flex = tampil, none = hilang */
      --nav-home-search-width: 100px;         /* lebar input search */
      --nav-home-search-focus: 150px;         /* lebar input search saat fokus */

      /* — VIDEO navbar — */
      --nav-video-bg:           #000000;      /* warna background navbar video */
      --nav-video-border-show:  0px;          /* tebal garis bawah (0px = hilang) */
      --nav-video-border-color: #98FB98;      /* warna garis bawah (jika aktif) */
      --nav-video-padding:      8px 15px;     /* padding navbar video */
      --nav-video-logo-color:   #98FB98;      /* warna teks logo */
      --nav-video-logo-size:    1.5rem;       /* ukuran teks logo */
      --nav-video-logo-show:    none;         /* block = tampil, none = hilang */
      --nav-video-lang-show:    none;         /* flex = tampil, none = hilang */
      --nav-video-search-width: 25px;         /* lebar input search */
      --nav-video-search-focus: 50px;         /* lebar input search saat fokus */
    }

    /* ============================================
       NAVBAR — MODE HOME/GRID
    ============================================ */
    .navbar-custom {
      background-color: var(--nav-home-bg);
      padding: var(--nav-home-padding);
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: var(--nav-home-border-show) solid var(--nav-home-border-color);
      transition: background 0.3s, border 0.3s, padding 0.3s;
    }

    /* ============================================
       NAVBAR — MODE VIDEO
    ============================================ */
    .navbar-custom.video-mode {
      background-color: var(--nav-video-bg);
      padding: var(--nav-video-padding);
      border-bottom: var(--nav-video-border-show) solid var(--nav-video-border-color);
    }
    /* Logo */
    .navbar-custom.video-mode .brand-logo {
      display: var(--nav-video-logo-show);
      color: var(--nav-video-logo-color);
      font-size: var(--nav-video-logo-size);
    }
    /* Tombol ID/EN */
    .navbar-custom.video-mode .lang-switch {
      display: var(--nav-video-lang-show);
    }
    /* Search — selalu di kanan, ukuran mengecil */
    .navbar-custom.video-mode .search-container {
      padding: 3px 8px;
      border-radius: 14px;
    }
    .navbar-custom.video-mode .search-container input {
      width: var(--nav-video-search-width);
    }
    .navbar-custom.video-mode .search-container input:focus {
      width: var(--nav-video-search-focus);
    }
    .navbar-custom.video-mode .fa-search { font-size: 0.4rem !important; }

    /* ── Home mode base styles ── */
    .brand-logo {
      color: var(--nav-home-logo-color);
      font-weight: 900;
      font-size: var(--nav-home-logo-size);
      cursor: pointer; text-decoration: none; text-transform: uppercase;
    }
    .lang-switch { display: flex; gap: 5px; margin-right: 10px; }
    .btn-lang { background: #222; color: #fff; border: 1px solid #8ad62d; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-lang.active { background: #98FB98; color: #000; }
    .search-container { display: flex; align-items: center; background: #1a1a1a; border-radius: 20px; padding: 5px 12px; border: 1px solid #98FB98; }
    .search-container input { background: transparent; border: none; color: #fff; outline: none; font-size: 0.85rem; width: var(--nav-home-search-width); transition: 0.3s; }
    .search-container input:focus { width: var(--nav-home-search-focus); }

    /* Pastikan grup kanan navbar selalu rata kanan */
    .navbar-right-group { display: flex; align-items: center; margin-left: auto; }

    @media (max-width: 480px) {
      .navbar-custom { padding: 8px 10px; }
      .brand-logo { font-size: 1.1rem; }
      .lang-switch { gap: 3px; margin-right: 5px; }
      .btn-lang { padding: 1px 5px; }
      .search-container { padding: 1.5px 4px; }
      .search-container input { width: 60px; }
      .search-container input:focus { width: 80px; }
    }

    .main-content { padding: 15px; max-width: 1150px; margin: auto; }
    .video-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
    @media (min-width: 992px) { .video-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

    .video-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
    .video-card:hover { border-color: #98FB98; transform: translateY(-3px); }
    .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .video-card-title { padding: 8px; font-size: 0.8rem; font-weight: 600; line-height: 1.3; height: 45px; overflow: hidden; }

    @media (max-width: 600px) {
      .video-page-container { padding: 0 !important; }
      .info-section { padding: 15px !important; }
      .player-container { border-radius: 0 !important; }
    }

    .player-container { position: relative; width: 100%; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; }
    .player-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }
    .video-mask { position: absolute; z-index: 99999; background: transparent; pointer-events: all; touch-action: none; }
    .mask-top { top: 0; left: 0; width: 65%; height: 55px; }
    .mask-bottom { bottom: 0; left: 40%; width: 100%; height: 43px; }
    #player-box:fullscreen .video-mask, #player-box:-webkit-full-screen .video-mask { display: block !important; }

    .btn-fs-custom { position: absolute; bottom: 18px; right: 18px; z-index: 2147483647; cursor: pointer; background: transparent; color: #fff; width: 23px; height: 23px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; box-shadow: 0 0 20px #98FB98; border: 2px solid #98FB98; }
    .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    .play-overlay i { font-size: 4rem; color: #ff032d; }

    .btn-action { width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; background: #98FB98; color: #000; font-size: 1rem; transition: 0.3s; text-transform: uppercase; }
    .btn-action:hover { background: #ff032d; color: #000; transform: scale(1.02); }

    .dual-action-wrap { display: flex; gap: 10px; margin-bottom: 18px; }

    .home-split-btn {
      width: 50%; border: none; padding: 10px 6px; border-radius: 10px;
      font-weight: 800; background: #98FB98; color: #000;
      font-size: 0.8rem; text-transform: uppercase; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 0 12px rgba(152,251,152,0.4);
      transition: all 0.2s ease; letter-spacing: 0.5px;
    }
    .home-split-btn:hover { background: #7ddb7d; transform: translateY(-2px); box-shadow: 0 0 20px rgba(152,251,152,0.6); }
    .home-split-btn:active { transform: scale(0.97); }

    .offer-split-btn {
      width: 50%; border: none; padding: 10px 6px; border-radius: 10px;
      font-weight: 800; color: #fff; font-size: 0.8rem;
      text-transform: uppercase; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      box-shadow: 0 0 14px rgba(255,65,108,0.5);
      transition: all 0.2s ease; letter-spacing: 0.5px;
      animation: pulse-offer 2s infinite;
    }
    .offer-split-btn:hover { background: linear-gradient(135deg, #ff4b2b, #ff416c); transform: translateY(-2px); box-shadow: 0 0 24px rgba(255,65,108,0.7); }
    .offer-split-btn:active { transform: scale(0.97); }

    @keyframes pulse-offer {
      0%, 100% { box-shadow: 0 0 14px rgba(255,65,108,0.5); }
      50% { box-shadow: 0 0 24px rgba(255,65,108,0.85); }
    }

    .summary-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border-left: 4px solid #98FB98; }
    .summary-text { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.4; margin-bottom: 15px; letter-spacing: -0.2px; color: #ddd; text-align: left; }

    .recommendation-slider { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none; }
    .slider-item { min-width: 160px; background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .slider-item img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .slider-item p { font-size: 0.75rem; padding: 8px; margin: 0; height: 38px; overflow: hidden; }

    .loading-screen { display: flex; align-items: center; justify-content: center; height: 60vh; flex-direction: column; gap: 15px; }
    .loading-screen p { color: #98FB98; font-size: 0.9rem; }

    /* ============================================
       NATIVE BANNER AD
    ============================================ */
    .native-banner-wrap {
      position: relative;
      width: 100%;
      margin: 14px 0;
      border-radius: 10px;
      overflow: hidden;
      background: #e00;
      min-height: 90px;
      /* Ukuran auto & responsive */
    }
    .native-banner-wrap .close-btn {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px;
      background: rgba(0,0,0,0.65); color: #fff;
      border: 2px solid #fff; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; cursor: pointer; z-index: 10;
      line-height: 1;
    }
    .native-banner-wrap .close-btn:hover { background: rgba(0,0,0,0.9); }
    /* Isi iklan native bisa diganti kode asli dari jaringan iklan */
    .native-banner-inner {
      width: 100%; padding: 18px 40px 18px 18px;
      display: flex; flex-direction: column; justify-content: center;
      min-height: 90px;
    }
    /* Grid span full width untuk banner di tengah grid */
    .grid-full-span { grid-column: 1 / -1; }
  </style>
</head>
<body>

  <nav class="navbar-custom" id="main-navbar">
    <div class="brand-logo" onclick="handleBrandClick()">Trend4GenZ</div>
    <!-- grup kanan: lang-switch + search — selalu rata kanan, search tidak berpindah -->
    <div class="navbar-right-group">
      <div class="lang-switch">
        <button class="btn-lang" id="btn-id" onclick="changeLang('id')">ID</button>
        <button class="btn-lang" id="btn-en" onclick="changeLang('en')">EN</button>
      </div>
      <div class="search-container">
        <input id="searchInput" placeholder="Cari..." type="text"/>
        <i class="fas fa-search" id="searchBtn" style="color:#98FB98; font-size:0.8rem; cursor:pointer;"></i>
      </div>
    </div>
  </nav>

  <div class="main-content" id="app">
    <div class="loading-screen">
      <i class="fas fa-spinner fa-spin" style="font-size:2rem; color:#98FB98;"></i>
      <p>Memuat video...</p>
    </div>
  </div>

<script>
/* =============================================
   KONFIGURASI IKLAN — EDIT DI SINI
   true  = AKTIF / false = NONAKTIF
============================================= */
const AD_CONFIG = {
  // ── Master switch — jika false, semua iklan mati ──
  allAds: true,

  // ── Per-halaman switch ──
  gridPageAds: {
    nativeBanner: true,   // Banner native di halaman GRID (home)
  },
  videoPageAds: {
    nativeBanner: true,   // Banner native di halaman VIDEO
  },

  // ── Switch lain ──
  useDirect:   false,
  usePopunder: false,

  // ── Posisi banner di grid: setelah baris ke-berapa (0-indexed row) ──
  // Karena 2 kolom, baris ke-2 = setelah item ke-4
  gridBannerAfterRow: 1,   // 0 = baris pertama, 1 = baris kedua, dst.
  gridColumnsOnMobile: 2,  // sesuai grid-template-columns mobile

  links: {
    direct:   "https://google.translate.com",
    popunder: "https://google.com",
  },

  /* ── HTML IKLAN NATIVE ──────────────────────────────────────
     Ganti isi di bawah ini dengan kode dari jaringan iklan Anda
     (Google AdSense native, Media.net, PropellerAds, dll.)
     Contoh di bawah adalah SIMULASI tampilan iklan native.
  ─────────────────────────────────────────────────────────── */
  nativeBannerHTML: `
    <div style="
      display:flex; align-items:center; gap:14px;
      background: linear-gradient(135deg,#c00 0%,#e00 60%,#f52 100%);
      padding:14px 40px 14px 14px; border-radius:10px; min-height:90px;
      font-family:'Segoe UI',sans-serif; cursor:pointer;
      text-decoration:none; box-sizing:border-box; width:100%;
    " onclick="window.open('https://google.com','_blank')">
      <div style="flex-shrink:0; text-align:center; color:#ffdd00; font-size:11px; font-weight:800; line-height:1.2;">
        CONTOH<br>IKLAN
      </div>
      <div style="flex-grow:1;">
        <div style="color:#fff; font-size:18px; font-weight:900; letter-spacing:0.5px; text-transform:uppercase; line-height:1.2;">
          IKLAN NATIVE BANNER
        </div>
        <div style="color:rgba(255,255,255,0.85); font-size:12px; margin-top:4px;">
          Pasang kode iklan native Anda di sini (Google AdSense, Media.net, dll.)
        </div>
      </div>
      <div style="flex-shrink:0; background:#ffdd00; color:#c00; font-size:11px; font-weight:900; padding:6px 10px; border-radius:6px; text-transform:uppercase; white-space:nowrap;">
        PELAJARI
      </div>
    </div>
  `
};

/* ─────────────────────────────────────────── */

const PLAYER_CONFIG = { enablePlayButtonDirectAds: false };
const SEO_CONFIG    = { autoGeoLanguage: true };

let currentLang = 'id';
let playCounter = 0;
let videoDatabaseEN = [];
let videoDatabaseID = [];

/* ─── Helper: render native banner ─── */
function buildNativeBanner(extraClass) {
  if (!AD_CONFIG.allAds) return '';
  return `
    <div class="native-banner-wrap ${extraClass || ''}" id="native-banner-${Date.now()}">
      <div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'" title="Tutup">✕</div>
      <div class="native-banner-inner">
        ${AD_CONFIG.nativeBannerHTML}
      </div>
    </div>
  `;
}

/* ─── Bot redirect ─── */
(function() {
  const ua = navigator.userAgent.toLowerCase();
  const isBot = ua.includes('facebookexternalhit') || ua.includes('twitterbot') ||
    ua.includes('whatsapp') || ua.includes('linkedinbot') || ua.includes('telegrambot');
  if (isBot) {
    const params = new URLSearchParams(window.location.search);
    window.location.replace('https://og.trend4genz.fun/api/proxy?v=' + (params.get('v')||'') + '&lang=' + (params.get('lang')||'id'));
  }
})();

/* ─── Load DB ─── */
async function loadDatabases() {
  try {
    const [resEN, resID] = await Promise.all([fetch('./db-en.json'), fetch('./db-id.json')]);
    videoDatabaseEN = await resEN.json();
    videoDatabaseID = await resID.json();
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><p style="color:#ff032d;">❌ Gagal memuat database.</p></div>';
    throw e;
  }
}

/* ─── URL helpers ─── */
function getUrlParams()      { return new URLSearchParams(window.location.search); }
function getCurrentSlug()    { return getUrlParams().get('v'); }
function getCurrentLangParam(){ return getUrlParams().get('lang'); }

async function detectGeoLanguage() {
  try { const r = await fetch('https://ipapi.co/json/'); const d = await r.json(); return d.country_code === 'ID' ? 'id' : 'en'; }
  catch(e) { return 'id'; }
}

function updateCanonical(slug, lang) {
  let c = document.getElementById('dynamic-canonical');
  if (!c) { c = document.createElement('link'); c.id='dynamic-canonical'; c.rel='canonical'; document.head.appendChild(c); }
  c.href = window.location.origin + window.location.pathname + '?v=' + slug + '&lang=' + lang;
}

function seoUrl(text) {
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}

function navigateTo(slug) {
  const db = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  const video = db.find(v => v.slug === slug);
  if (!video) return;
  const url = window.location.pathname + '?lang=' + currentLang + '&v=' + seoUrl(video.title);
  history.pushState({}, '', url);
  router();
}

/* ─── Ads ─── */
function runAd(type) {
  if (!AD_CONFIG.allAds) return;
  if (type === 'pop' && AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder, '_blank');
  if (type === 'direct' && AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct, '_blank');
}

/* ─── Language ─── */
function changeLang(lang) {
  currentLang = lang;
  const currentSlug = getCurrentSlug();
  let targetSlug = null;
  if (currentSlug) {
    const dbTarget = lang === 'id' ? videoDatabaseID : videoDatabaseEN;
    const dbSource = lang === 'id' ? videoDatabaseEN : videoDatabaseID;
    const videoSource = dbSource.find(v => v.slug === currentSlug || seoUrl(v.title) === currentSlug);
    if (videoSource) {
      const videoTarget = dbTarget.find(v => v.youtubeId === videoSource.youtubeId);
      targetSlug = videoTarget ? seoUrl(videoTarget.title) : seoUrl(videoSource.title);
    } else { targetSlug = currentSlug; }
  }
  let url = window.location.pathname + '?lang=' + lang;
  if (targetSlug) url += '&v=' + targetSlug;
  history.pushState({}, '', url);
  router();
}

function handleBrandClick() {
  runAd('pop');
  history.pushState({}, '', window.location.pathname + '?lang=' + currentLang);
  router();
}

function handleSpecialOffer() {
  if (AD_CONFIG.allAds && AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct, '_blank');
}

/* ─── Search ─── */
function initSearch() {
  const si = document.getElementById('searchInput');
  const sb = document.getElementById('searchBtn');
  if (!si || !sb) return;
  si.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  sb.addEventListener('click', doSearch);
}

function doSearch() {
  const si = document.getElementById('searchInput');
  if (!si) return;
  const val = si.value.toLowerCase();
  const db = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  if (!db || !Array.isArray(db)) return;
  renderGrid(document.getElementById('app'), db.filter(v => v.title.toLowerCase().includes(val)));
}

/* ─── Player ─── */
function handlePlay(id) {
  playCounter++;
  if (PLAYER_CONFIG.enablePlayButtonDirectAds && playCounter === 1 && AD_CONFIG.allAds && AD_CONFIG.useDirect) {
    runAd('direct');
    document.getElementById('play-msg').innerText = '';
    return;
  }
  document.getElementById('player-box').innerHTML =
    '<iframe src="https://www.youtube.com/embed/' + id +
    '?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>' +
    '<div class="video-mask mask-top"></div>' +
    '<div class="video-mask mask-bottom"></div>' +
    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
}

function toggleFullScreen() {
  const elem = document.getElementById('player-box');
  const icon = document.querySelector('#fs-btn i');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    icon.className = 'fas fa-compress';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    icon.className = 'fas fa-expand';
  }
}

/* ─── Grid ─── */
function renderGrid(container, data) {
  /* Hitung posisi insert banner: setelah row ke-N
     Mobile = 2 kolom → row N = setelah item index (N+1)*2 - 1
  */
  const cols  = window.innerWidth >= 992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const afterRow = AD_CONFIG.gridBannerAfterRow;
  const insertAfterIndex = (afterRow + 1) * cols - 1; // 0-based index item terakhir di baris tsb

  const showGridBanner = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  // Bangun item grid
  let gridItems = data.map((v, i) => {
    let html = `
      <a href="?v=${v.slug}&lang=${currentLang}" class="video-card-link" style="text-decoration:none; color:inherit;"
         onclick="handleNavigation(event, '${v.slug}')">
        <div class="video-card">
          <img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title}" loading="lazy"/>
          <div class="video-card-title">${v.title}</div>
        </div>
      </a>`;
    // Sisipkan banner SETELAH item ke-insertAfterIndex (full-width, span all cols)
    if (showGridBanner && i === insertAfterIndex) {
      html += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    }
    return html;
  }).join('');

  container.className = 'main-content';
  container.innerHTML =
    '<h5 class="mb-3" style="color:#98FB98">🔥 TRENDING VIDEO</h5>' +
    '<div class="video-grid">' + gridItems + '</div>';
}

function handleNavigation(event, slug) {
  event.preventDefault();
  navigateTo(slug);
}

/* ─── SEO helpers ─── */
function setOGTag(property, content) {
  let tag = document.querySelector('meta[property="' + property + '"]');
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute('property', property); document.head.appendChild(tag); }
  tag.setAttribute('content', content);
}
function setTwitterTag(name, content) {
  let tag = document.querySelector('meta[name="' + name + '"]');
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute('name', name); document.head.appendChild(tag); }
  tag.setAttribute('content', content);
}

function updateMetaTags(video) {
  const title = video.title + " | Trend4GenZ";
  const description = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160) : video.title;
  const summaryClean = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,150) : video.title;
  const tags = video.tags ? video.tags.slice(0,5).join(',') : '';
  const image = 'https://og.trend4genz.fun/api/og?title=' + encodeURIComponent(video.title) +
    '&summary=' + encodeURIComponent(summaryClean) + '&tags=' + encodeURIComponent(tags);
  const url = window.location.href;

  document.title = title;
  setTwitterTag('description', description);
  setOGTag('og:title', title); setOGTag('og:description', description); setOGTag('og:image', image);
  setOGTag('og:image:width','1200'); setOGTag('og:image:height','630'); setOGTag('og:url', url);
  setOGTag('og:type','video.other');
  setOGTag('og:video','https://www.youtube.com/embed/' + video.youtubeId);
  setOGTag('og:video:type','text/html');
  setTwitterTag('twitter:card','summary_large_image'); setTwitterTag('twitter:title', title);
  setTwitterTag('twitter:description', description); setTwitterTag('twitter:image', image);

  const existingSchema = document.getElementById('schema-video');
  if (existingSchema) existingSchema.remove();
  const schema = document.createElement('script');
  schema.id = 'schema-video'; schema.type = 'application/ld+json';
  schema.textContent = JSON.stringify({
    "@context":"https://schema.org","@type":"VideoObject","name":video.title,
    "description":description,
    "thumbnailUrl":["https://img.youtube.com/vi/"+video.youtubeId+"/maxresdefault.jpg","https://img.youtube.com/vi/"+video.youtubeId+"/hqdefault.jpg"],
    "embedUrl":"https://www.youtube.com/embed/"+video.youtubeId,"url":url,
    "publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun"}
  });
  document.head.appendChild(schema);
}

/* ─── Video page ─── */
function renderVideo(container, v) {
  updateMetaTags(v);
  updateCanonical(v.slug, currentLang);
  playCounter = 0;
  container.className = 'main-content video-page-container';

  const db = currentLang === 'id' ? videoDatabaseID : videoDatabaseEN;
  const related = db.filter(item => item.slug !== v.slug).sort(() => 0.5 - Math.random()).slice(0, 8);

  const showVideoBanner = AD_CONFIG.allAds && AD_CONFIG.videoPageAds.nativeBanner;

  container.innerHTML =
    '<div class="player-container" id="player-box">' +
    '<div class="play-overlay" onclick="handlePlay(\'' + v.youtubeId + '\')">' +
    '<i class="fas fa-play-circle"></i>' +
    '<div id="play-msg" style="margin-top:10px; font-weight:bold;">TAP TO WATCH</div>' +
    '</div>' +
    '<img src="https://img.youtube.com/vi/' + v.youtubeId + '/maxresdefault.jpg" style="width:100%; height:100%; object-fit:cover;"/>' +
    '</div>' +
    '<div class="info-section" style="padding:15px;">' +
    '<h1 style="font-size:1.2rem; font-weight:800; margin:15px 0;">' + v.title + '</h1>' +
    '<div class="dual-action-wrap">' +
    '<button class="home-split-btn" onclick="handleBrandClick()"><i class="fas fa-home"></i> HOME</button>' +
    '<button class="offer-split-btn" onclick="handleSpecialOffer()"><i class="fas fa-bolt"></i> SPECIAL OFFER 🔥</button>' +
    '</div>' +
    /* ── Native banner video page ── */
    (showVideoBanner ? buildNativeBanner() : '') +
    '<div class="summary-box"><div class="summary-text">' + v.summary + '</div></div>' +
    '<div style="display:none;">' + (v.tags ? v.tags.join(', ') : '') + '</div>' +
    '<h6 class="mt-4 mb-3" style="color:#98FB98">MORE VIDEOS</h6>' +
    '<div class="recommendation-slider">' +
    related.map(r =>
      '<div class="slider-item" onclick="navigateTo(\'' + r.slug + '\')">' +
      '<img src="https://img.youtube.com/vi/' + r.youtubeId + '/mqdefault.jpg" loading="lazy"/>' +
      '<p>' + r.title + '</p>' +
      '</div>'
    ).join('') +
    '</div>' +
    '</div>';
}

/* ─── Router ─── */
async function router() {
  const app    = document.getElementById('app');
  const navbar = document.getElementById('main-navbar');
  let slug = getCurrentSlug();
  let lang = getCurrentLangParam();

  if (!lang) lang = SEO_CONFIG.autoGeoLanguage ? await detectGeoLanguage() : 'id';
  currentLang = lang;

  document.getElementById('btn-id').className = lang === 'id' ? 'btn-lang active' : 'btn-lang';
  document.getElementById('btn-en').className = lang === 'en' ? 'btn-lang active' : 'btn-lang';

  const db = lang === 'id' ? videoDatabaseID : videoDatabaseEN;

  if (!slug || slug === 'home') {
    /* GRID mode — navbar normal */
    navbar.classList.remove('video-mode');
    renderGrid(app, [...db].sort(() => 0.5 - Math.random()));
    updateCanonical('home', lang);
  } else {
    const video = db.find(v => v.slug === slug || seoUrl(v.title) === slug);
    if (video) {
      /* VIDEO mode — navbar: logo hilang, border hilang, search kecil */
      navbar.classList.add('video-mode');
      renderVideo(app, video);
      updateCanonical(video.slug, lang);
      updateMetaTags(video);
    } else {
      navbar.classList.remove('video-mode');
      document.title = "Trend4GenZ - Streaming";
      renderGrid(app, db);
      updateCanonical('home', lang);
    }
  }
  window.scrollTo(0, 0);
}

/* ─── Events ─── */
window.addEventListener('popstate', router);
window.addEventListener('load', async () => {
  await loadDatabases();
  initSearch();
  router();
});
</script>
