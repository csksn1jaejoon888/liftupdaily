<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend4GenZ - Streaming</title>
<meta name="description" content="Trending videos and entertainment.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>

body {
    background-color:#212122;
    color:#f1f1f1;
    font-family:'Segoe UI',sans-serif;
    margin:0;
    overflow-x:hidden;
}

.navbar-custom {
    background-color:#000;
    padding:12px 15px;
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1.5px solid #98FB98;
}

.brand-logo {
    color:#98FB98;
    font-weight:900;
    font-size:1.5rem;
    cursor:pointer;
    text-transform:uppercase;
}

.lang-switch {
    display:flex;
    gap:5px;
    margin-right:10px;
}

.btn-lang {
    background:#222;
    color:#fff;
    border:1px solid #8ad62d;
    font-size:0.7rem;
    padding:2px 8px;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
}

.btn-lang.active {
    background:#98FB98;
    color:#000;
}

.search-container {
    display:flex;
    align-items:center;
    background:#1a1a1a;
    border-radius:20px;
    padding:5px 12px;
    border:1px solid #98FB98;
}

.search-container input {
    background:transparent;
    border:none;
    color:#fff;
    outline:none;
    font-size:0.85rem;
    width:100px;
}

.main-content {
    padding:15px;
    max-width:1150px;
    margin:auto;
}

.video-grid {
    display:grid;
    gap:12px;
    grid-template-columns:repeat(2,1fr);
}

@media(min-width:992px){
    .video-grid{
        grid-template-columns:repeat(4,1fr);
        gap:20px;
    }
}

.video-card {
    background:#1a1a1a;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.video-card:hover {
    transform:translateY(-3px);
    border:1px solid #98FB98;
}

.video-card img {
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
}

.video-card-title {
    padding:8px;
    font-size:0.8rem;
    font-weight:600;
    line-height:1.3;
    height:45px;
    overflow:hidden;
}

.player-container {
    position:relative;
    width:100%;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:16/9;
}

.player-container iframe {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
}

.play-overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
    cursor:pointer;
}

.play-overlay i {
    font-size:4rem;
    color:#ff032d;
}

.summary-box {
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:12px;
    border-left:4px solid #98FB98;
}

.summary-text {
    white-space:pre-wrap;
    font-size:0.9rem;
    line-height:1.4;
    color:#ddd;
}

.recommendation-slider {
    display:flex;
    overflow-x:auto;
    gap:12px;
    padding-bottom:15px;
    scrollbar-width:none;
}

.slider-item {
    min-width:160px;
    background:#1a1a1a;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
}

.slider-item img {
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
}

.slider-item p {
    font-size:0.75rem;
    padding:8px;
    margin:0;
    height:38px;
    overflow:hidden;
}

.video-mask {
    position:absolute;
    z-index:99999;
    background:transparent;
    pointer-events:all;
    touch-action:none;
}

.mask-top {
    top:0;
    left:0;
    width:65%;
    height:55px;
}

.mask-bottom {
    bottom:0;
    left:40%;
    width:100%;
    height:43px;
}

.btn-fs-custom {
    position:absolute;
    bottom:18px;
    right:18px;
    z-index:999999;
    cursor:pointer;
    color:#fff;
    width:23px;
    height:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:12px;
    box-shadow:0 0 20px #98FB98;
    border:2px solid #98FB98;
}

@media(max-width:480px){

    .navbar-custom {
        padding:8px 10px;
    }

    .brand-logo {
        font-size:1.1rem;
    }

    .lang-switch {
        gap:3px;
        margin-right:5px;
    }

    .btn-lang {
        padding:1px 5px;
    }

    .search-container {
        padding:1.5px 4px;
    }

    .search-container input {
        width:60px;
    }
}

</style>
</head>
<body>

<nav class="navbar-custom">

<div class="brand-logo" onclick="handleBrandClick()">
Trend4GenZ
</div>

<div style="display:flex;align-items:center;">

<div class="lang-switch">
<button class="btn-lang" id="btn-id" onclick="changeLang('id')">ID</button>
<button class="btn-lang" id="btn-en" onclick="changeLang('en')">EN</button>
</div>

<div class="search-container">
<input id="searchInput" placeholder="Cari..." type="text">
<i class="fas fa-search" id="searchBtn" style="color:#98FB98;font-size:0.8rem;cursor:pointer;"></i>
</div>

</div>

</nav>

<div class="main-content" id="app"></div>

<script>

const AD_CONFIG = {
    allAds:false,
    useDirect:true,
    usePopunder:true,
    useNative:true,

    links:{
        direct:'https://google.com',
        popunder:'https://google.com',
        nativeCode:''
    }
};

const PLAYER_CONFIG = {
    enablePlayButtonDirectAds:false
};

let currentLang = 'id';
let playCounter = 0;

let videoDatabaseEN = [];
let videoDatabaseID = [];

async function loadDatabases(){

    const [resEN,resID] = await Promise.all([
        fetch('db-en.json'),
        fetch('db-id.json')
    ]);

    videoDatabaseEN = await resEN.json();
    videoDatabaseID = await resID.json();
}

function getUrlParams(){
    return new URLSearchParams(window.location.search);
}

function getCurrentSlug(){
    return getUrlParams().get('v');
}

function getCurrentLangParam(){
    return getUrlParams().get('lang');
}

function updateCanonical(slug,lang){

    let canonical = document.getElementById('dynamic-canonical');

    if(!canonical){
        canonical = document.createElement('link');
        canonical.id = 'dynamic-canonical';
        canonical.rel = 'canonical';
        document.head.appendChild(canonical);
    }

    canonical.href =
        window.location.origin +
        window.location.pathname +
        '?v=' + slug +
        '&lang=' + lang;
}

function setOGTag(property,content){

    let tag = document.querySelector(
        'meta[property="' + property + '"]'
    );

    if(!tag){
        tag = document.createElement('meta');
        tag.setAttribute('property',property);
        document.head.appendChild(tag);
    }

    tag.setAttribute('content',content);
}

function updateMetaTags(video){

    document.title = video.title + ' | Trend4GenZ';

    setOGTag('og:title',video.title);
    setOGTag('og:description',video.summary || video.title);
    setOGTag(
        'og:image',
        'https://img.youtube.com/vi/' +
        video.youtubeId +
        '/maxresdefault.jpg'
    );

    let descTag = document.querySelector(
        'meta[name="description"]'
    );

    if(!descTag){
        descTag = document.createElement('meta');
        descTag.name = 'description';
        document.head.appendChild(descTag);
    }

    descTag.content = video.summary || video.title;
}

function navigateTo(slug){

    const url =
        window.location.pathname +
        '?lang=' + currentLang +
        '&v=' + slug;

    history.pushState({},'',url);

    router();
}

function changeLang(lang){

    currentLang = lang;

    const slug = getCurrentSlug();

    let url =
        window.location.pathname +
        '?lang=' + lang;

    if(slug){
        url += '&v=' + slug;
    }

    history.pushState({},'',url);

    router();
}

function handleBrandClick(){

    const url =
        window.location.pathname +
        '?lang=' + currentLang;

    history.pushState({},'',url);

    router();
}

function renderGrid(container,data){

    container.innerHTML =

    '<h5 class="mb-3" style="color:#98FB98">🔥 TRENDING VIDEO</h5>' +

    '<div class="video-grid">' +

    data.map(v =>

        '<div class="video-card" onclick="navigateTo(\'' + v.slug + '\')">' +

        '<img src="https://img.youtube.com/vi/' + v.youtubeId + '/mqdefault.jpg">' +

        '<div class="video-card-title">' +
        v.title +
        '</div>' +

        '</div>'

    ).join('') +

    '</div>';
}

function handlePlay(id){

    document.getElementById('player-box').innerHTML =

    '<iframe src="https://www.youtube.com/embed/' +
    id +
    '?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allowfullscreen></iframe>' +

    '<div class="video-mask mask-top"></div>' +

    '<div class="video-mask mask-bottom"></div>' +

    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
}

function toggleFullScreen(){

    const elem = document.getElementById('player-box');

    if(!document.fullscreenElement){
        elem.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function renderVideo(container,v){

    updateMetaTags(v);

    const db = currentLang === 'id'
        ? videoDatabaseID
        : videoDatabaseEN;

    const related = [...db]
        .filter(item => item.slug !== v.slug)
        .sort(() => 0.5 - Math.random())
        .slice(0,8);

    container.innerHTML =

    '<div class="player-container" id="player-box">' +

    '<div class="play-overlay" onclick="handlePlay(\'' + v.youtubeId + '\')">' +

    '<i class="fas fa-play-circle"></i>' +

    '<div style="margin-top:10px;font-weight:bold;">TAP TO WATCH</div>' +

    '</div>' +

    '<img src="https://img.youtube.com/vi/' +
    v.youtubeId +
    '/maxresdefault.jpg" style="width:100%;height:100%;object-fit:cover;">' +

    '</div>' +

    '<div class="info-section">' +

    '<h1 style="font-size:1.2rem;font-weight:800;margin:15px 0;">' +
    v.title +
    '</h1>' +

    '<div class="summary-box">' +

    '<div class="summary-text">' +
    v.summary +
    '</div>' +

    '</div>' +

    '<h6 class="mt-4 mb-3" style="color:#98FB98">MORE VIDEOS</h6>' +

    '<div class="recommendation-slider">' +

    related.map(r =>

        '<div class="slider-item" onclick="navigateTo(\'' + r.slug + '\')">' +

        '<img src="https://img.youtube.com/vi/' + r.youtubeId + '/mqdefault.jpg">' +

        '<p>' + r.title + '</p>' +

        '</div>'

    ).join('') +

    '</div>' +

    '</div>';
}

function doSearch(){

    const val = document
        .getElementById('searchInput')
        .value
        .toLowerCase();

    const db = currentLang === 'id'
        ? videoDatabaseID
        : videoDatabaseEN;

    const filtered = db.filter(v =>
        v.title.toLowerCase().includes(val)
    );

    renderGrid(
        document.getElementById('app'),
        filtered
    );
}

async function router(){

    const app = document.getElementById('app');

    const slug = getCurrentSlug();

    let lang = getCurrentLangParam() || 'id';

    currentLang = lang;

    document.getElementById('btn-id').className =
        lang === 'id'
            ? 'btn-lang active'
            : 'btn-lang';

    document.getElementById('btn-en').className =
        lang === 'en'
            ? 'btn-lang active'
            : 'btn-lang';

    const db = currentLang === 'id'
        ? videoDatabaseID
        : videoDatabaseEN;

    if(!slug || slug === 'home'){

        renderGrid(
            app,
            [...db].sort(() => 0.5 - Math.random())
        );

        updateCanonical('home',lang);

    } else {

        const video = db.find(v =>
            String(v.slug) === String(slug)
        );

        if(video){

            renderVideo(app,video);

            updateCanonical(video.slug,lang);

        } else {

            renderGrid(app,[...db]);
        }
    }

    window.scrollTo(0,0);
}

window.addEventListener('popstate',router);

window.addEventListener('load',async () => {

    await loadDatabases();

    router();

    document
        .getElementById('searchBtn')
        .addEventListener('click',doSearch);

    document
        .getElementById('searchInput')
        .addEventListener('keydown',e => {

            if(e.key === 'Enter'){
                doSearch();
            }
        });
});

</script>

</body>
</html>
