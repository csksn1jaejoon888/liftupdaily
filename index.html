<script>
// ════════════════════════════════════════════════════════
//  KONFIGURASI
// ════════════════════════════════════════════════════════
const AD_CONFIG = {
  allAds: false,
  gridPageAds:  { nativeBanner: true },
  videoPageAds: { nativeBanner: true },
  useDirect:    false,
  usePopunder:  false,

};

const PLAY_AD_CONFIG = {
  enablePlayButtonDirectAds: false,
  adUrl: "https://mediaindonesia.com",
  adStartFromVideo: 2,
};

// ── Pagination config ──────────────────────────────────
const PAGE_SIZE = 24; // video per halaman
let currentPage = 0;
let currentData = [];

let videoWatchCount = 0;
let playCounter     = 0;
let videoDatabaseEN  = [];
let videoDatabaseID  = [];
let videoDatabaseALL = [];

(function(){ document.documentElement.setAttribute('translate','no'); document.documentElement.classList.add('notranslate'); })();

// ════════════════════════════════════════════════════════
//  META & SEO
// ════════════════════════════════════════════════════════
function updateHtmlLang() {
  document.getElementById('html-root').setAttribute('lang','en');
  const m = document.getElementById('meta-content-language');
  if(m) m.setAttribute('content','en');
  const og = document.querySelector('meta[property="og:locale"]');
  if(og) og.setAttribute('content','en_US');
}

function updateCanonical(slug, source) {
  let c = document.getElementById('dynamic-canonical');
  if(source==='nofollow'){ if(c) c.remove(); return; }
  if(!c){ c=document.createElement('link'); c.id='dynamic-canonical'; c.rel='canonical'; document.head.appendChild(c); }
  c.href = (!slug||slug==='home') ? 'https://www.trend4genz.fun/' : location.origin+location.pathname+'?v='+slug;
}

function updateRobotsBySource(source) {
  let t = document.querySelector('meta[name="robots"]');
  if(!t){ t=document.createElement('meta'); t.setAttribute('name','robots'); document.head.appendChild(t); }
  t.setAttribute('content', source==='nofollow'?'noindex, nofollow':'index, follow');
}

// ════════════════════════════════════════════════════════
//  LOAD DATABASE — parallel fetch, featured.json prioritas
// ════════════════════════════════════════════════════════
async function loadDatabases() {
  // Coba load featured.json dulu (20 video pilihan — generate otomatis oleh clean-db.js)
  // Ini yang tampil pertama kali dengan cepat
  let featured = [];
  try {
    const res = await fetch('./featured.json');
    if(res.ok) featured = await res.json();
  } catch(e) {}

  // Load DB lengkap di background
  const [resEN, resID] = await Promise.all([
    fetch('./db-en.json'),
    fetch('./db-id.json')
  ]);
  videoDatabaseEN  = (await resEN.json()).map(v=>({...v, source: v.source||'seo'}));
  videoDatabaseID  = (await resID.json()).map(v=>({...v, source: v.source||'nofollow'}));

  // Shuffle semua
  const shuffled = [...videoDatabaseEN, ...videoDatabaseID].sort(()=>0.5-Math.random());

  // Kalau featured ada → tampilkan featured dulu di depan, sisanya di belakang
  if(featured.length) {
    const featuredIds = new Set(featured.map(v=>v.youtubeId));
    const rest = shuffled.filter(v=>!featuredIds.has(v.youtubeId));
    videoDatabaseALL = [...featured, ...rest];
  } else {
    videoDatabaseALL = shuffled;
  }
}

// ════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════
function getUrlParams()   { return new URLSearchParams(location.search); }
function getCurrentSlug() { return getUrlParams().get('v'); }

function seoUrl(text) {
  if(!text) return '';
  if(text.includes('-')) return text;
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}

function navigateTo(slug) {
  const video = videoDatabaseALL.find(v=>v.slug===slug||seoUrl(v.title)===slug);
  if(!video) return;
  history.pushState({},'', location.pathname+'?v='+video.slug);
  router();
}

function buildNativeBanner(extraClass) {
  if(!AD_CONFIG.allAds) return '';
  return `<div class="native-banner-wrap ${extraClass||''}" id="nb-${Date.now()}"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'">✕</div><div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div></div>`;
}

function runAd(type) {
  if(!AD_CONFIG.allAds) return;
  if(type==='pop'    && AD_CONFIG.usePopunder) window.open(AD_CONFIG.links.popunder,'_blank');
  if(type==='direct' && AD_CONFIG.useDirect)   window.open(AD_CONFIG.links.direct,'_blank');
}

function handleBrandClick() { runAd('pop'); history.pushState({},'',location.pathname); router(); }
function handleSpecialOffer() { if(AD_CONFIG.allAds&&AD_CONFIG.useDirect) window.open(AD_CONFIG.links.direct,'_blank'); }
function handleNavigation(e,slug) { e.preventDefault(); navigateTo(slug); }

// ════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════
function initSearch() {
  const input=document.getElementById('searchInput');
  const btn=document.getElementById('searchBtn');
  const sug=document.getElementById('searchSuggestions');
  if(!input||!btn||!sug) return;
  let ai=-1;

  input.addEventListener('input',()=>{
    const val=input.value.trim().toLowerCase(); ai=-1;
    if(val.length<1){hide();return;}
    const matches=videoDatabaseALL.filter(v=>v.title.toLowerCase().includes(val)).slice(0,7);
    if(!matches.length){sug.innerHTML=`<div class="suggestion-empty">No results for "<b>${val}</b>"</div>`;sug.classList.add('show');return;}
    const hl=(t,q)=>t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<em>$1</em>');
    sug.innerHTML=matches.map((v,i)=>`<div class="suggestion-item" data-slug="${v.slug}"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" loading="lazy" alt=""/><span>${hl(v.title,val)}</span></div>`).join('');
    sug.classList.add('show');
    sug.querySelectorAll('.suggestion-item').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();input.value='';hide();navigateTo(el.dataset.slug);}));
  });

  input.addEventListener('keydown',e=>{
    const items=sug.querySelectorAll('.suggestion-item');
    if(e.key==='ArrowDown'){e.preventDefault();ai=Math.min(ai+1,items.length-1);upA(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();ai=Math.max(ai-1,-1);upA(items);}
    else if(e.key==='Enter'){if(ai>=0&&items[ai]){input.value='';hide();navigateTo(items[ai].dataset.slug);}else doSearch();}
    else if(e.key==='Escape'){hide();input.blur();}
  });

  function upA(items){items.forEach((el,i)=>el.classList.toggle('active',i===ai));}
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))hide();});
  btn.addEventListener('click',doSearch);
  function hide(){sug.classList.remove('show');sug.innerHTML='';ai=-1;}
}

function doSearch() {
  const input=document.getElementById('searchInput');
  const sug=document.getElementById('searchSuggestions');
  if(!input) return;
  const val=input.value.trim().toLowerCase();
  if(!val) return;
  if(sug){sug.classList.remove('show');sug.innerHTML='';}
  const results=videoDatabaseALL.filter(v=>v.title.toLowerCase().includes(val));
  renderGrid(document.getElementById('app'), results, true);
  document.getElementById('main-navbar').classList.remove('video-mode');
}

// ════════════════════════════════════════════════════════
//  RENDER GRID — dengan pagination
// ════════════════════════════════════════════════════════
function renderGrid(container, data, isSearch=false) {
  currentData = data;
  currentPage = 0;
  container.className = 'main-content';

  const cols = window.innerWidth>=992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow+1)*cols-1;
  const showBanner = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  // Render halaman pertama saja
  const firstBatch = data.slice(0, PAGE_SIZE);
  const hasMore    = data.length > PAGE_SIZE;

  container.innerHTML =
    '<h5 style="color:#98FB98;margin-bottom:12px">🔥 TRENDING VIDEO</h5>' +
    '<div class="video-grid" id="video-grid-inner">' +
    renderCards(firstBatch, 0, insertAfterIndex, showBanner) +
    '</div>' +
    (hasMore ? '<div class="load-more-wrap"><button class="btn-load-more" id="btn-load-more" onclick="loadMore()">Load More</button></div>' : '');

  currentPage = 1;
}

function renderCards(items, startIndex, insertAfterIndex, showBanner) {
  return items.map((v,i)=>{
    const idx = startIndex + i;
    const nf  = v.source==='nofollow' ? ' rel="nofollow"' : '';
    // Hanya 4 card pertama pakai eager loading (LCP), sisanya lazy
    const loading = idx < 4 ? 'eager' : 'lazy';
    let html = `<a href="?v=${v.slug}"${nf} class="video-card-link" style="text-decoration:none;color:inherit" onclick="handleNavigation(event,'${v.slug}')"><div class="video-card"><div class="thumb-wrap"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title}" loading="${loading}" decoding="async" width="320" height="180"/></div><div class="video-card-title">${v.title}</div></div></a>`;
    if(showBanner && idx===insertAfterIndex) html += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    return html;
  }).join('');
}

function loadMore() {
  const grid = document.getElementById('video-grid-inner');
  const btn  = document.getElementById('btn-load-more');
  if(!grid) return;

  const cols = window.innerWidth>=992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow+1)*cols-1;
  const showBanner = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;

  const start = currentPage * PAGE_SIZE;
  const end   = start + PAGE_SIZE;
  const batch = currentData.slice(start, end);

  if(!batch.length) { if(btn) btn.style.display='none'; return; }

  grid.insertAdjacentHTML('beforeend', renderCards(batch, start, insertAfterIndex, showBanner));
  currentPage++;

  if(end >= currentData.length && btn) btn.style.display='none';
}

// ════════════════════════════════════════════════════════
//  HANDLE PLAY
// ════════════════════════════════════════════════════════
function handlePlay(youtubeId) {
  playCounter++;
  const adAktif = PLAY_AD_CONFIG.enablePlayButtonDirectAds && videoWatchCount>=PLAY_AD_CONFIG.adStartFromVideo && playCounter===1;
  if(adAktif) window.open(PLAY_AD_CONFIG.adUrl,'_blank');
  document.getElementById('player-box').innerHTML =
    '<iframe src="https://www.youtube.com/embed/'+youtubeId+'?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>' +
    '<div class="video-mask mask-top"></div><div class="video-mask mask-bottom"></div>' +
    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></div>';
}

function toggleFullScreen() {
  const el=document.getElementById('player-box');
  const ic=document.querySelector('#fs-btn i');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    ic.className='fas fa-compress';
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    ic.className='fas fa-expand';
  }
}

// ════════════════════════════════════════════════════════
//  META TAGS UPDATE
// ════════════════════════════════════════════════════════
function updateMetaTags(video) {
  const title = video.title+' | Trend4GenZ';
  const desc  = video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160) : video.title;
  const img   = 'https://img.youtube.com/vi/'+video.youtubeId+'/maxresdefault.jpg';
  const url   = location.href;

  document.title = title;
  const md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', desc);

  const ogMap = {'og-type':'video.other','og-title':title,'og-description':desc,'og-url':url,'og-image':img,'og-image-width':'1280','og-image-height':'720','og-image-alt':video.title};
  Object.entries(ogMap).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.setAttribute('content',val); });

  const es=document.getElementById('schema-video'); if(es) es.remove();
  const sc=document.createElement('script'); sc.id='schema-video'; sc.type='application/ld+json';
  sc.textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"VideoObject",
    "name":video.title,"description":desc,
    "uploadDate":video.uploadDate||new Date().toISOString().substring(0,19)+'+00:00',
    "thumbnailUrl":["https://img.youtube.com/vi/"+video.youtubeId+"/maxresdefault.jpg","https://img.youtube.com/vi/"+video.youtubeId+"/hqdefault.jpg","https://img.youtube.com/vi/"+video.youtubeId+"/mqdefault.jpg"],
    "embedUrl":"https://www.youtube.com/embed/"+video.youtubeId,"url":url,
    "inLanguage":video.source==='nofollow'?"id":"en",
    "publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun","logo":{"@type":"ImageObject","url":"https://www.trend4genz.fun/logo.png"}}
  });
  document.head.appendChild(sc);
}

// ════════════════════════════════════════════════════════
//  RENDER VIDEO
// ════════════════════════════════════════════════════════
function renderVideo(container, v) {
  updateMetaTags(v);
  updateRobotsBySource(v.source);
  updateCanonical(v.slug, v.source);
  document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el=>el.remove());

  videoWatchCount++; playCounter=0;
  container.className='main-content video-page-container';
  const related=videoDatabaseALL.filter(i=>i.slug!==v.slug).sort(()=>0.5-Math.random()).slice(0,8);
  const showBanner=AD_CONFIG.allAds&&AD_CONFIG.videoPageAds.nativeBanner;

  container.innerHTML=
    '<div class="player-container" id="player-box">'+
    '<div class="play-overlay" onclick="handlePlay(\''+v.youtubeId+'\')">'+
    '<i class="fas fa-play-circle"></i>'+
    '<div style="margin-top:10px;font-weight:bold">TAP TO WATCH</div></div>'+
    // Thumbnail dengan width/height eksplisit — cegah CLS
    '<img src="https://img.youtube.com/vi/'+v.youtubeId+'/hqdefault.jpg" width="480" height="360" style="width:100%;height:100%;object-fit:cover" loading="eager" decoding="async" alt="'+v.title+'"/>'+
    '</div>'+
    '<div class="info-section" style="padding:15px">'+
    '<h1 style="font-size:1.2rem;font-weight:800;margin:15px 0">'+v.title+'</h1>'+
    '<div class="dual-action-wrap">'+
    '<button class="home-split-btn" onclick="handleBrandClick()"><i class="fas fa-home"></i> HOME</button>'+
    '<button class="offer-split-btn" onclick="handleSpecialOffer()"><i class="fas fa-bolt"></i> More Info 🔥</button>'+
    '</div>'+
    (showBanner?buildNativeBanner():'')+
    '<div class="summary-box"><div class="summary-text">'+v.summary+'</div></div>'+
    '<div style="display:none">'+(v.tags?v.tags.join(', '):'')+'</div>'+
    '<h6 style="color:#98FB98;margin:24px 0 12px">MORE VIDEOS</h6>'+
    '<div class="recommendation-slider">'+
    related.map(r=>'<div class="slider-item" onclick="navigateTo(\''+r.slug+'\')"><img src="https://img.youtube.com/vi/'+r.youtubeId+'/mqdefault.jpg" loading="lazy" width="160" height="90" alt="'+r.title+'"/><p>'+r.title+'</p></div>').join('')+
    '</div></div>';
}

// ════════════════════════════════════════════════════════
//  ROUTER
// ════════════════════════════════════════════════════════
async function router() {
  const app   =document.getElementById('app');
  const navbar=document.getElementById('main-navbar');
  const slug  =getCurrentSlug();

  updateHtmlLang();
  updateRobotsBySource('seo');

  if(!slug||slug==='home') {
    navbar.classList.remove('video-mode');
    renderGrid(app, videoDatabaseALL);
    updateCanonical('home','seo');
    const og=document.getElementById('og-type'); if(og) og.setAttribute('content','website');
  } else {
    const video=videoDatabaseALL.find(v=>v.slug===slug||seoUrl(v.title)===slug);
    if(video) {
      navbar.classList.add('video-mode');
      renderVideo(app, video);
    } else {
      history.replaceState({},'',location.pathname);
      navbar.classList.remove('video-mode');
      document.title='Trend4GenZ - Streaming';
      renderGrid(app, videoDatabaseALL);
      updateCanonical('home','seo');
    }
  }
  window.scrollTo(0,0);
}

window.addEventListener('popstate', router);
window.addEventListener('load', async ()=>{
  try {
    await loadDatabases();
  } catch(e) {
    document.getElementById('app').innerHTML='<div class="loading-screen"><p style="color:#ff032d">❌ Gagal memuat database.</p></div>';
    return;
  }
  initSearch();
  router();
});
</script>
