# ══════════════════════════════════════════════════════════════════
#  GitHub Actions — Auto Build
#  Trigger: setiap push yang mengubah db-en.json atau db-id.json
#  Yang dikerjakan otomatis:
#    1. Cek video mati + hapus duplikat + bersihkan hashtag
#    2. Generate sitemap.xml baru dari db-en.json
#    3. Hapus /video/ lama + buat ulang semua halaman statis
#       + overwrite index.html dengan 20 card random hardcoded
#    4. Commit + push hasilnya balik ke GitHub
# ══════════════════════════════════════════════════════════════════
name: Auto Clean DB & Generate Static Pages
on:
  push:
    paths:
      - 'db-en.json'
      - 'db-id.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clean DB — hapus video mati + dedup + hashtag
        run: node clean-db.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Generate sitemap.xml
        run: node generate-sitemap.js

      - name: Generate static pages (video + homepage)
        run: node generate-pages.js

      - name: Commit & push hasil
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db-en.json db-id.json sitemap.xml index.html
          git add video/
          git diff --staged --quiet || git commit -m "auto: clean + sitemap + static pages [skip ci]"
          git push
