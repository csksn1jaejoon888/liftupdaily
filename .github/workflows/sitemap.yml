name: Generate Sitemap Automated

on:
  push:
    branches: [ main, master ] # Otomatis jalan setiap ada push/commit baru
  schedule:
    - cron: '0 0 * * *' # Otomatis jalan setiap jam 12 malam

permissions:
  contents: write # Izin untuk menulis dan mengupdate file sitemap.xml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan Skrip Generator Sitemap
        run: node generate-sitemap.js

      - name: Simpan dan Push sitemap.xml ke Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update sitemap.xml [Skip CI]" && git push)
