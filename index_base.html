function updateHtmlLang() {
  document.getElementById('html-root').setAttribute('lang','en');
  const m = document.getElementById('meta-content-language');
  if(m) m.setAttribute('content','en');
  const og = document.querySelector('meta[property="og:locale"]');
  if(og) og.setAttribute('content','en_US');
}

function updateCanonical(slug, source) {
  let c = document.getElementById('dynamic-canonical');
  if(source==='nofollow'){ if(c) c.remove(); return; }
  if(!c){ c=document.createElement('link'); c.id='dynamic-canonical'; c.rel='canonical'; document.head.appendChild(c); }
  c.href = (!slug||slug==='home') ? 'https://www.trend4genz.fun/' : 'https://www.trend4genz.fun/?v='+slug;
}

function updateRobotsBySource(source) {
  let t = document.querySelector('meta[name="robots"]');
  if(!t){ t=document.createElement('meta'); t.setAttribute('name','robots'); document.head.appendChild(t); }
  t.setAttribute('content', source==='nofollow' ? 'noindex, nofollow, noarchive, noimageindex' : 'index, follow');
}

// ════════════════════════════════════════════════════════

async function loadDatabases() {
  const ROOT = location.origin + '/';
  const [resEN, resID] = await Promise.all([
    fetch(ROOT + 'db-en.json'),
    fetch(ROOT + 'db-id.json').catch(()=>({ok:false}))
  ]);
  videoDatabaseEN  = (await resEN.json()).map(v=>({...v, source:'seo'}));
  videoDatabaseID  = resID.ok
    ? (await resID.json()).map(v=>({...v, source:'nofollow'}))
    : [];
  videoDatabaseALL = [...videoDatabaseEN, ...videoDatabaseID].sort(()=>0.5-Math.random());
}

// ════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════
function getUrlParams()   { return new URLSearchParams(location.search); }
function getCurrentSlug() {
  const fromQuery = getUrlParams().get('v');
  if (fromQuery) return fromQuery;
  const parts = location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,'').split('/').filter(Boolean);
  if (!parts.length) return null;
  const last = parts[parts.length - 1];
  if (!last || last.length < 3) return null;
  return last;
}
function seoUrl(text) {
  if(!text) return '';
  if(text.includes('-')) return text;
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/--+/g,'-').substring(0,70).replace(/-$/,'');
}
function navigateTo(slug) {
  const video = videoDatabaseALL.find(v=>v.slug===slug||seoUrl(v.title)===slug);
  if(!video) return;
  if(video.source==='nofollow') {
    history.pushState({},'', location.origin + '/?v=' + video.slug);
    router();
  } else {
    window.location.href = location.origin + '/video/' + video.slug + '/';
  }
}
function buildNativeBanner(extraClass) {
  if(!AD_CONFIG.allAds) return '';
  return `<div class="native-banner-wrap ${extraClass||''}" id="nb-${Date.now()}"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'">✕</div><div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div></div>`;
}
function runAd(type) {
  if(!AD_CONFIG.allAds) return;
  if(type==='pop'     && AD_CONFIG.usePopunder) window.open(AD_CONFIG.popunderUrl,'_blank');
  if(type==='direct'  && AD_CONFIG.useDirect)   window.open(AD_CONFIG.directUrl,'_blank');
}
function handleBrandClick() { runAd('pop'); history.pushState({},'', location.origin + '/'); router(); }
function handleSpecialOffer() { if(AD_CONFIG.allAds && AD_CONFIG.useDirect) window.open(AD_CONFIG.directUrl,'_blank'); }
function handleNavigation(e,slug) { e.preventDefault(); navigateTo(slug); }

// ════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════
function initSearch() {
  const input=document.getElementById('searchInput');
  const btn=document.getElementById('searchBtn');
  const sug=document.getElementById('searchSuggestions');
  if(!input||!btn||!sug) return;
  let ai=-1;

  function hide(){ sug.classList.remove('show'); sug.innerHTML=''; ai=-1; }
  function upA(items){ items.forEach((el,i)=>el.classList.toggle('active',i===ai)); }

  input.addEventListener('input',()=>{
    const val=input.value.trim().toLowerCase(); ai=-1;
    if(val.length<1){ hide(); return; }
    const matches=videoDatabaseALL.filter(v=>v.title.toLowerCase().includes(val)).slice(0,7);
    if(!matches.length){ sug.innerHTML=`<div class="suggestion-empty">No results for "<b>${val}</b>"</div>`; sug.classList.add('show'); return; }
    const hl=(t,q)=>t.replace(new RegExp('('+q.replace(/[.*+?^$\x7B\x7D()|[\]\\]/g,'\\$&')+')','gi'),'<em>$1</em>');
    sug.innerHTML=matches.map(v=>`<div class="suggestion-item" data-slug="${v.slug}"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" loading="lazy" alt=""/><span>${hl(v.title,val)}</span></div>`).join('');
    sug.classList.add('show');
    sug.querySelectorAll('.suggestion-item').forEach(el=>el.addEventListener('mousedown',e=>{ e.preventDefault(); input.value=''; hide(); navigateTo(el.dataset.slug); }));
  });

  input.addEventListener('keydown',e=>{
    const items=sug.querySelectorAll('.suggestion-item');
    if(e.key==='ArrowDown'){ e.preventDefault(); ai=Math.min(ai+1,items.length-1); upA(items); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); ai=Math.max(ai-1,-1); upA(items); }
    else if(e.key==='Enter'){ if(ai>=0&&items[ai]){ input.value=''; hide(); navigateTo(items[ai].dataset.slug); } else doSearch(); }
    else if(e.key==='Escape'){ hide(); input.blur(); }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrapper')) hide(); });
  btn.addEventListener('click', doSearch);
}

function doSearch() {
  const input=document.getElementById('searchInput');
  const sug=document.getElementById('searchSuggestions');
  if(!input) return;
  const val=input.value.trim().toLowerCase();
  if(!val) return;
  if(sug){ sug.classList.remove('show'); sug.innerHTML=''; }
  history.pushState({}, '', location.origin + '/?search=' + encodeURIComponent(val));
  router();
}

// ════════════════════════════════════════════════════════
//  RENDER GRID (homepage / search / tag)
// ════════════════════════════════════════════════════════
function renderGrid(container, data) {
  currentData = data;
  currentPage = 0;
  container.className = 'main-content';
  const cols = window.innerWidth>=992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow+1)*cols-1;
  const showBanner = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;
  const firstBatch = data.slice(0, PAGE_SIZE);
  const hasMore    = data.length > PAGE_SIZE;
  container.innerHTML =
    '<h5 style="color:#98FB98;margin-bottom:12px">🔥 TRENDING VIDEO</h5>' +
    '<div class="video-grid" id="video-grid-inner">' +
    renderCards(firstBatch, 0, insertAfterIndex, showBanner) +
    '</div>' +
    (hasMore ? '<div class="load-more-wrap"><button class="btn-load-more" id="btn-load-more" onclick="loadMore()">Load More</button></div>' : '');
  currentPage = 1;
}

function renderCards(items, startIndex, insertAfterIndex, showBanner) {
  return items.map((v,i)=>{
    const idx = startIndex + i;
    const nf  = v.source==='nofollow' ? ' rel="nofollow noopener"' : '';
    const loading = idx < 4 ? 'eager' : 'lazy';
    const href = v.source==='nofollow' ? `/?v=${v.slug}` : `/video/${v.slug}/`;
    let html = `<a href="${href}"${nf} class="video-card-link" style="text-decoration:none;color:inherit" onclick="handleNavigation(event,'${v.slug}')"><div class="video-card"><div class="thumb-wrap"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title.replace(/"/g,'&quot;')}" loading="${loading}" decoding="async" width="320" height="180" onload="this.classList.add('loaded')" onerror="this.src='https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg';this.classList.add('loaded')"/></div><div class="video-card-title">${v.title}</div></div></a>`;
    if(showBanner && idx===insertAfterIndex) html += `<div class="grid-full-span">${buildNativeBanner()}</div>`;
    return html;
  }).join('');
}

function loadMore() {
  const grid = document.getElementById('video-grid-inner');
  const btn  = document.getElementById('btn-load-more');
  if(!grid) return;
  const cols = window.innerWidth>=992 ? 4 : AD_CONFIG.gridColumnsOnMobile;
  const insertAfterIndex = (AD_CONFIG.gridBannerAfterRow+1)*cols-1;
  const showBanner = AD_CONFIG.allAds && AD_CONFIG.gridPageAds.nativeBanner;
  const start = currentPage * PAGE_SIZE;
  const batch = currentData.slice(start, start + PAGE_SIZE);
  if(!batch.length){ if(btn) btn.style.display='none'; return; }
  grid.insertAdjacentHTML('beforeend', renderCards(batch, start, insertAfterIndex, showBanner));
  currentPage++;
  if(start + PAGE_SIZE >= currentData.length && btn) btn.style.display='none';
}

// ════════════════════════════════════════════════════════
//  HANDLE PLAY — SPA (db-id.json)
// ════════════════════════════════════════════════════════
function handlePlay(youtubeId) {
  playCounter++;
  // Play button ads: aktif mulai dari play ke-N
  const adAktif = AD_CONFIG.allAds && AD_CONFIG.usePlayAds
    && playCounter >= AD_CONFIG.playAdsStartFrom;
  if(adAktif) window.open(AD_CONFIG.playAdsUrl,'_blank');
  document.getElementById('player-box').innerHTML =
    '<iframe src="https://www.youtube.com/embed/'+youtubeId+'?autoplay=1&rel=0&modestbranding=1&fs=0&controls=1&playsinline=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>' +
    '<div class="video-mask mask-top"></div><div class="video-mask mask-bottom"></div>' +
    '<div id="fs-btn" class="btn-fs-custom" onclick="toggleFullScreen()" title="Fullscreen"><svg id="fs-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/><polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/></svg></div>';
}

function filterByTag(tag) {
  const rel  = videoDatabaseALL.filter(v=>v.tags&&v.tags.some(t=>t.toLowerCase()===tag.toLowerCase()));
  const rest = videoDatabaseALL.filter(v=>!v.tags||!v.tags.some(t=>t.toLowerCase()===tag.toLowerCase()));
  history.pushState({}, '', location.origin + '/?tag=' + encodeURIComponent(tag));
  document.getElementById('main-navbar').classList.remove('video-mode');
  const app = document.getElementById('app');
  renderGrid(app, rel.length ? [...rel,...rest] : videoDatabaseALL);
  _insertHomeBtn(app, rel.length ? '🏷️ Tag: #'+tag+' ('+rel.length+' videos)' : '🔥 TRENDING VIDEO');
  window.scrollTo(0,0);
}

function toggleFullScreen() {
  const el=document.getElementById('player-box');
  const svg=document.getElementById('fs-icon');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    if(svg) svg.innerHTML='<polyline points="8 3 3 3 3 8"/><line x1="3" y1="3" x2="10" y2="10"/><polyline points="21 8 21 3 16 3"/><line x1="21" y1="3" x2="14" y2="10"/><polyline points="3 16 3 21 8 21"/><line x1="3" y1="21" x2="10" y2="14"/><polyline points="16 21 21 21 21 16"/><line x1="21" y1="21" x2="14" y2="14"/>';
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    if(svg) svg.innerHTML='<polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/><polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/>';
  }
}

// ════════════════════════════════════════════════════════
//  META TAGS UPDATE
// ════════════════════════════════════════════════════════
function updateMetaTags(video) {
  const title = video.title+' | Trend4GenZ';
  const desc  = video.meta_description ? video.meta_description : (video.summary ? video.summary.replace(/<[^>]*>/g,'').substring(0,160)+'...' : video.title);
  const img   = 'https://img.youtube.com/vi/'+video.youtubeId+'/maxresdefault.jpg';
  const url   = location.href;
  document.title = title;
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',desc);
  const ogMap={'og-type':'video.other','og-title':title,'og-description':desc,'og-url':url,'og-image':img,'og-image-width':'1280','og-image-height':'720','og-image-alt':video.title};
  Object.entries(ogMap).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.setAttribute('content',val); });
  const es=document.getElementById('schema-video'); if(es) es.remove();
  const sc=document.createElement('script'); sc.id='schema-video'; sc.type='application/ld+json';
  sc.textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"VideoObject",
    "name":video.title,"description":desc,
    "uploadDate":video.uploadDate||new Date().toISOString().substring(0,19)+'+00:00',
    "thumbnailUrl":["https://img.youtube.com/vi/"+video.youtubeId+"/maxresdefault.jpg","https://img.youtube.com/vi/"+video.youtubeId+"/hqdefault.jpg"],
    "embedUrl":"https://www.youtube.com/embed/"+video.youtubeId,"url":url,
    "inLanguage":video.source==='nofollow'?"id":"en",
    "publisher":{"@type":"Organization","name":"Trend4GenZ","url":"https://www.trend4genz.fun","logo":{"@type":"ImageObject","url":"https://www.trend4genz.fun/logo.png"}}
  });
  document.head.appendChild(sc);
}

// ════════════════════════════════════════════════════════
//  RENDER VIDEO — SPA (db-id.json, desktop 2-kolom)
// ════════════════════════════════════════════════════════
function renderVideo(container, v) {
  updateMetaTags(v);
  updateRobotsBySource(v.source);
  updateCanonical(v.slug, v.source);
  document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el=>el.remove());
  videoWatchCount++; playCounter=0;
  container.className='main-content video-page-container';

  const videoTags = v.tags||[];
  const tagsHTML  = videoTags.length>0
    ? '<div class="seo-tags-container">'+videoTags.map(tag=>`<span class="seo-tag-badge" onclick="filterByTag('${tag.replace(/'/g,"\\'")}')">&#35;${tag}</span>`).join('')+'</div>'
    : '';
  const showBanner = AD_CONFIG.allAds && AD_CONFIG.videoPageAds.nativeBanner;

  // Related videos (acak, 30 untuk side scroll)
  const shuffled = videoDatabaseALL.filter(i=>i.slug!==v.slug).sort(()=>0.5-Math.random());
  const SLIDER_INIT=7; let sliderPage=1;

  // Mobile horizontal slider items
  function buildSliderItems(items){
    return items.map(r=>`<div class="slider-item" onclick="navigateTo('${r.slug}')"><img src="https://img.youtube.com/vi/${r.youtubeId}/mqdefault.jpg" loading="lazy" width="160" height="90" alt="${r.title.replace(/"/g,'&quot;')}"/><p>${r.title}</p></div>`).join('');
  }

  // Desktop side column items
  function buildSideItems(items){
    return items.map(r=>`<a href="/video/${r.slug}/" class="side-slider-item"><img src="https://img.youtube.com/vi/${r.youtubeId}/mqdefault.jpg" loading="lazy" width="108" height="60" alt="${r.title.replace(/"/g,'&quot;')}"/><p>${r.title}</p></a>`).join('');
  }

  // Tombol native banner di mobile (di bawah tombol HOME/More Info)
  const mobileBannerHTML = showBanner
    ? `<div class="native-banner-wrap" id="spa-nb-mob"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'">✕</div><div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div></div>`
    : '';

  // Sidebar desktop native banner
  const sideBannerHTML = showBanner
    ? `<div class="side-native-banner"><div class="native-banner-wrap" id="spa-nb-side"><div class="close-btn" onclick="this.closest('.native-banner-wrap').style.display='none'">✕</div><div class="native-banner-inner">${AD_CONFIG.nativeBannerHTML}</div></div></div>`
    : '';

  container.innerHTML =
    '<div class="video-desktop-layout">' +

      /* ── Kolom kiri: player + info ── */
      '<div class="video-main-col">' +
        '<div class="player-container" id="player-box">' +
          '<img src="https://img.youtube.com/vi/'+v.youtubeId+'/hqdefault.jpg" width="480" height="360" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2" loading="eager" decoding="async" alt="'+v.title.replace(/"/g,'&quot;')+'"/>' +
          '<div class="play-overlay" onclick="handlePlay(\''+v.youtubeId+'\')" style="z-index:20">' +
            '<svg class="play-btn-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="40" r="38" fill="rgba(0,0,0,0.55)" stroke="#ff032d" stroke-width="3"/><polygon points="32,24 60,40 32,56" fill="#ff032d"/></svg>' +
            '<div class="play-overlay-label">TAP TO WATCH</div></div>' +
        '</div>' +
        '<div class="info-section" style="padding:15px">' +
          '<h1 style="font-size:1.2rem;font-weight:800;margin:15px 0">'+v.title+'</h1>' +
          '<div class="dual-action-wrap">' +
            '<button class="home-split-btn" onclick="handleBrandClick()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> HOME</button>' +
            '<button class="offer-split-btn" onclick="handleSpecialOffer()"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="margin-right:5px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> More Info 🔥</button>' +
          '</div>' +
          mobileBannerHTML +
          '<div class="summary-box"><div class="summary-text">'+v.summary+'</div>'+tagsHTML+'</div>' +
          /* Mobile horizontal slider */
          '<div class="recommendation-slider-wrap">' +
            '<p class="more-videos-label">MORE VIDEOS</p>' +
            '<div class="recommendation-slider" id="rec-slider">'+buildSliderItems(shuffled.slice(0,SLIDER_INIT))+'</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      /* ── Kolom kanan desktop: related + banner ── */
      '<div class="video-side-col">' +
        '<div class="side-related-label">🎬 Related Videos</div>' +
        '<div class="side-slider" id="side-slider-desktop">'+buildSideItems(shuffled.slice(0,20))+'</div>' +
        sideBannerHTML +
      '</div>' +

    '</div>';

  // Mobile horizontal slider infinite scroll
  const slider=document.getElementById('rec-slider');
  if(slider){ slider.addEventListener('scroll',function(){ if(this.scrollLeft+this.clientWidth>=this.scrollWidth-100){ const more=shuffled.slice(sliderPage*SLIDER_INIT,(sliderPage+1)*SLIDER_INIT); if(more.length){ this.insertAdjacentHTML('beforeend',buildSliderItems(more)); sliderPage++; } } }); }

  // Desktop side slider infinite scroll
  const sideSlider=document.getElementById('side-slider-desktop');
  if(sideSlider){
    let sideLoaded=20;
    sideSlider.addEventListener('scroll',function(){
      if(this.scrollTop+this.clientHeight>=this.scrollHeight-100){
        const more=shuffled.slice(sideLoaded,sideLoaded+10);
        if(more.length){ this.insertAdjacentHTML('beforeend',buildSideItems(more)); sideLoaded+=more.length; }
      }
    });
  }

  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════════════════
//  HELPER: Tombol HOME kecil di hasil search/tag
// ════════════════════════════════════════════════════════
function _insertHomeBtn(app, headingText) {
  const h = app.querySelector('h5');
  if(!h) return;
  if(headingText) h.textContent = headingText;
  if(!document.getElementById('btn-back-home')) {
    var btn = document.createElement('button');
    btn.id = 'btn-back-home';
    btn.onclick = function(){ history.pushState({},'',location.origin+'/'); router(); };
    btn.style.cssText = 'background:transparent;color:var(--green);border:1px solid var(--green);padding:4px 12px;border-radius:14px;font-weight:700;font-size:.75rem;cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;line-height:1';
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> HOME';
    h.parentNode.insertBefore(btn, h);
  }
}

// ════════════════════════════════════════════════════════
//  ROUTER
// ════════════════════════════════════════════════════════
async function router() {
  const app   = document.getElementById('app');
  const navbar= document.getElementById('main-navbar');
  const slug  = getCurrentSlug();
  const tag   = getUrlParams().get('tag');
  const search= getUrlParams().get('search');

  updateHtmlLang();
  updateRobotsBySource('seo');

  if(tag) {
    navbar.classList.remove('video-mode');
    if(!videoDatabaseALL.length) await loadDatabases();
    const rel  = videoDatabaseALL.filter(v=>v.tags&&v.tags.some(t=>t.toLowerCase()===tag.toLowerCase()));
    const rest = videoDatabaseALL.filter(v=>!v.tags||!v.tags.some(t=>t.toLowerCase()===tag.toLowerCase()));
    renderGrid(app, rel.length ? [...rel,...rest] : videoDatabaseALL);
    updateCanonical('home','seo');
    _insertHomeBtn(app, rel.length ? '🏷️ Tag: #'+tag+' ('+rel.length+' videos)' : '🔥 TRENDING VIDEO');
  } else if(search) {
    navbar.classList.remove('video-mode');
    if(!videoDatabaseALL.length) await loadDatabases();
    const q    = search.toLowerCase();
    const rel  = videoDatabaseALL.filter(v=>v.title.toLowerCase().includes(q));
    const rest = videoDatabaseALL.filter(v=>!v.title.toLowerCase().includes(q));
    renderGrid(app, rel.length ? [...rel,...rest] : videoDatabaseALL);
    updateCanonical('home','seo');
    _insertHomeBtn(app, rel.length ? '🔍 "'+search+'" — '+rel.length+' hasil' : '🔥 TRENDING VIDEO');
  } else if(!slug||slug==='home') {
    var oldBtn=document.getElementById('btn-back-home'); if(oldBtn) oldBtn.remove();
    navbar.classList.remove('video-mode');
    if(!videoDatabaseALL.length) { await loadDatabases(); renderGrid(app, videoDatabaseALL); }
    updateCanonical('home','seo');
    const og=document.getElementById('og-type'); if(og) og.setAttribute('content','website');
  } else {
    const video=videoDatabaseALL.find(v=>v.slug===slug||seoUrl(v.title)===slug);
    if(video) {
      navbar.classList.add('video-mode');
      renderVideo(app, video);
    } else {
      history.replaceState({},'', location.origin+'/');
      navbar.classList.remove('video-mode');
      document.title='Trend4GenZ - Streaming';
      if(!videoDatabaseALL.length) await loadDatabases();
      renderGrid(app, videoDatabaseALL);
      updateCanonical('home','seo');
    }
  }
  window.scrollTo(0,0);
}

window.addEventListener('popstate', router);
window.addEventListener('load', async ()=>{
  try { await loadDatabases(); } catch(e) {
    document.getElementById('app').innerHTML='<div class="loading-screen"><p style="color:#ff032d">❌ Gagal memuat database.</p></div>';
    return;
  }
  initSearch();
  router();
});
